<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Older QBar projects | QBar Studio</title><style>body{font:16px system-ui;margin:40px auto;padding:20px;max-width:700px;background:#f4f5f8;color:#202738}input,button,a{padding:12px;margin:5px}input{display:block;width:90%;border:1px solid #dfe3ed;border-radius:9px}button{border:1px solid #bacde4;border-radius:9px;background:linear-gradient(115deg,#c6e5ff,#ffd2e7)}[hidden]{display:none!important}article{border:1px solid #dfe3ed;border-radius:12px;padding:14px;margin-top:12px}</style></head><body><a href="/account">← Studio account</a><h1>Older QBar cloud projects</h1><p>Use your older QBar login to access projects saved before the shared Studio account. Your older projects have been kept.</p><div id="qbarSignedOut" hidden><button id="firebaseGoogle">Continue with Google</button><label>Email<input id="accountEmail" type="email" autocomplete="email"></label><label>Password<input id="accountPassword" type="password" autocomplete="current-password"></label><button id="firebaseEmailLogin">Log In</button><button id="firebaseResetPassword">Forgot password?</button></div><div id="qbarSignedIn" hidden><p id="qbarAccountEmail"></p><button id="firebaseLogout">Sign out of older account</button><div id="legacyProjects"></div></div><p id="firebaseAccountStatus" role="status"></p><script>window.qbarRefreshProjects=async()=>{if(!window.qbarAuth?.getUser()||!window.qbarCloud)return;const host=document.getElementById('legacyProjects');host.replaceChildren();try{const projects=await window.qbarCloud.list();for(const p of projects){const item=document.createElement('article'),title=document.createElement('strong'),button=document.createElement('button');title.textContent=p.name;button.textContent='Download project';button.onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));a.href=url;a.download='qbar-project-'+p.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};item.append(title,button);host.append(item)}if(!projects.length)host.textContent='No projects in this older account.'}catch(e){host.textContent='Could not load older projects. '+e.message}};</script><script type="module" src="/legacy-auth.js"></script></body></html>
