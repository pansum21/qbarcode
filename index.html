<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QBar Code Studio</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .view { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .view[hidden] { display: none; }

  .theme-switch {
    --sw-bg: #1c1233; --sw-fg: #fff; --sw-knob: #FF2E93;
    position: fixed; z-index: 2147483000;
    right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 6px; border: 0; border-radius: 999px;
    background: var(--sw-bg); color: var(--sw-fg);
    font: 600 13px/1 "Inter", "Outfit", system-ui, sans-serif;
    box-shadow: 0 6px 20px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.18) inset;
    cursor: pointer;
  }
  .theme-switch:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  body[data-theme="light"] .theme-switch { --sw-bg: #285a43; --sw-knob: #d4edac; }

  .track { position: relative; width: 44px; height: 26px; border-radius: 999px; background: rgba(255,255,255,.18); }
  .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
          background: var(--sw-knob); transition: transform .22s ease; }
  body[data-theme="dark"] .knob { transform: translateX(18px); }
  @media (max-width: 480px) { .label { display: none; } .theme-switch { padding-right: 6px; } }
</style>
</head>
<body data-theme="dark">

<!-- Dark theme (shown first) -->
<iframe id="view-dark" class="view" src="code_dark.html" title="Dark theme"></iframe>
<!-- Light theme (loads the first time you switch) -->
<iframe id="view-light" class="view" title="Light theme" hidden></iframe>

<button class="theme-switch" id="theme-switch" type="button" role="switch"
        aria-checked="true" aria-label="Switch to light theme">
  <span class="track" aria-hidden="true"><span class="knob"></span></span>
  <span class="label" id="theme-label">Light theme</span>
</button>

<script>
(function () {
  var PAGES = { dark: 'code_dark.html', light: 'qbar_code_studio_white.html' };
  var frames = { dark: document.getElementById('view-dark'), light: document.getElementById('view-light') };
  var btn = document.getElementById('theme-switch'), label = document.getElementById('theme-label');

  function setTheme(name, save) {
    if (!frames[name].getAttribute('src')) frames[name].src = PAGES[name];  // load on first use
    frames.dark.hidden  = name !== 'dark';
    frames.light.hidden = name !== 'light';
    document.body.setAttribute('data-theme', name);
    btn.setAttribute('aria-checked', String(name === 'dark'));
    btn.setAttribute('aria-label', name === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    label.textContent = name === 'dark' ? 'Light theme' : 'Dark theme';
    if (save) { try { localStorage.setItem('qbar-theme-v2', name); } catch (e) {} }
  }

  btn.addEventListener('click', function () {
    setTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
  });

  var start = 'dark';
  try { if (localStorage.getItem('qbar-theme-v2') === 'light') start = 'light'; } catch (e) {}
  setTheme(start, false);
})();
</script>
</body>
</html>
