dio-footer\">\n                \u003cspan>\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#i-check-circle\">\u003c/use>\u003c/svg>No sign-up\u003c/span>\n                \u003cspan>\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#i-check-circle\">\u003c/use>\u003c/svg>No watermarks\u003c/span>\n                \u003cspan>\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#i-check-circle\">\u003c/use>\u003c/svg>100% yours\u003c/span>\n                \u003cspan class=\"footer-micro\">Built for the way you share.\u003c/span>\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"benefits\" aria-label=\"The little things that make a difference\">\n            \u003carticle class=\"benefit\">\n                \u003cspan class=\"benefit-icon\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#i-shield\">\u003c/use>\u003c/svg>\u003c/span>\n                \u003cdiv>\u003ch3>Your data stays yours\u003c/h3>\u003cp>Everything happens right in your browser.\u003c/p>\u003c/div>\n            \u003c/article>\n            \u003carticle class=\"benefit\">\n                \u003cspan class=\"benefit-icon\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#i-infinity\">\u003c/use>\u003c/svg>\u003c/span>\n                \u003cdiv>\u003ch3>Create without limits\u003c/h3>\u003cp>No accounts, no credits, no catch.\u003c/p>\u003c/div>\n            \u003c/article>\n            \u003carticle class=\"benefit\">\n                \u003cspan class=\"benefit-icon\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#i-vector\">\u003c/use>\u003c/svg>\u003c/span>\n                \u003cdiv>\u003ch3>Crisp at every size\u003c/h3>\u003cp>Ready for screens, stickers, and print.\u003c/p>\u003c/div>\n            \u003c/article>\n        \u003c/section>\n    \u003c/main>\n\n    \u003cfooter class=\"site-footer\">\n        \u003cp>\u00a9 \u003cspan id=\"year\">2026\u003c/span> QBar Code Studio\u003c/p>\n        \u003cp class=\"footer-tagline\">Good things are one scan away.\u003c/p>\n        \u003cbutton type=\"button\" class=\"privacy-button\" data-open-dialog=\"privacy\">Privacy &amp; the small print \u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\">\u003c/use>\u003c/svg>\u003c/button>\n    \u003c/footer>\n\n    \u003cdialog class=\"info-dialog\" id=\"info-dialog\" aria-labelledby=\"dialog-title\">\n        \u003cdiv class=\"dialog-top\">\n            \u003cspan class=\"dialog-eyebrow\">QBAR CODE STUDIO\u003c/span>\n            \u003cbutton type=\"button\" class=\"dialog-close\" id=\"dialog-close\" aria-label=\"Close dialog\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#i-close\">\u003c/use>\u003c/svg>\u003c/button>\n        \u003c/div>\n        \u003cdiv id=\"dialog-content\">\u003c/div>\n    \u003c/dialog>\n\n    \u003ctemplate id=\"help-template\">\n        \u003ch2 id=\"dialog-title\">A little code. A lot of easy.\u003c/h2>\n        \u003cp class=\"dialog-intro\">From an idea to a downloadable code in three small steps.\u003c/p>\n        \u003col class=\"help-steps\">\n            \u003cli>\u003cspan class=\"step-number\">01\u003c/span>\u003cdiv>\u003cstrong>Pick your code. Add your content.\u003c/strong>\u003cp>QR codes handle links, numbers, Unicode text, and contact information. For everyday barcodes, CODE128 handles standard letters, numbers, and symbols.\u003c/p>\u003c/div>\u003c/li>\n            \u003cli>\u003cspan class=\"step-number\">02\u003c/span>\u003cdiv>\u003cstrong>Give it a little personality.\u003c/strong>\u003cp>Choose a dark, scan-friendly color and a QR pattern. Barcode format tips explain any special requirements.\u003c/p>\u003c/div>\u003c/li>\n            \u003cli>\u003cspan class=\"step-number\">03\u003c/span>\u003cdiv>\u003cstrong>Generate, download, and share.\u003c/strong>\u003cp>Choose PNG for an easy-to-use image or SVG for infinitely scalable artwork. Test your finished code with a scanner before printing in bulk.\u003c/p>\u003c/div>\u003c/li>\n        \u003c/ol>\n        \u003cdiv class=\"dialog-tip\">A quick shortcut: press \u003ckbd>Enter\u003c/kbd> to generate. In the QR field, use \u003ckbd>Shift\u003c/kbd> + \u003ckbd>Enter\u003c/kbd> to add a new line.\u003c/div>\n        \u003cdetails>\n            \u003csummary>Will my codes expire?\u003c/summary>\n            \u003cp>No. Downloaded codes are static and do not depend on QBar Code Studio. A linked website still needs to remain available. To change the encoded content, generate a new code.\u003c/p>\n        \u003c/details>\n        \u003cdetails>\n            \u003csummary>Which barcode format should I choose?\u003c/summary>\n            \u003cp>Use CODE128 for general-purpose labels. CODE39 is useful for uppercase identifiers. EAN-13 and UPC-A are retail formats with check digits; creating a barcode does not assign an official product identifier. ITF requires pairs of digits, and Pharmacode is a specialized numeric format.\u003c/p>\n        \u003c/details>\n    \u003c/template>\n\n    \u003ctemplate id=\"privacy-template\">\n        \u003ch2 id=\"dialog-title\">Your content is your business.\u003c/h2>\n        \u003cp class=\"dialog-intro\">A simple tool should come with a simple privacy promise.\u003c/p>\n        \u003cdiv class=\"dialog-copy\">\n            \u003cp>\u003cstrong>Your code content stays on your device.\u003c/strong> QR codes, barcodes, and downloads are generated locally in your browser. We don\u2019t upload, store, or keep a history of your input.\u003c/p>\n            \u003cp>\u003cstrong>No accounts. No tracking. No quotas.\u003c/strong> This page uses no analytics, advertising scripts, or usage counters. Generate and download as many codes as you need.\u003c/p>\n            \u003cp>\u003cstrong>A note about external resources:\u003c/strong> fonts load from Google Fonts, and generation libraries load from public CDNs. Those providers receive standard resource requests, but your entered code content is not included.\u003c/p>\n            \u003cp>\u003cstrong>Share thoughtfully.\u003c/strong> Anyone who can scan a code can read the information inside it. Avoid encoding passwords or other private information.\u003c/p>\n        \u003c/div>\n    \u003c/template>\n\n    \u003cdiv class=\"toast-container\" id=\"toast-container\" aria-live=\"polite\" aria-relevant=\"additions\">\u003c/div>\n\n    \n\n\n\n\n\u003cscript>\n!function(t,e){\"object\"==typeof exports&&\"object\"==typeof module?module.exports=e():\"function\"==typeof define&&define.amd?define([],e):\"object\"==typeof exports?exports.QRCodeStyling=e():t.QRCodeStyling=e()}(self,(function(){return(()=>{var t={192:(t,e)=>{var r,n,o=function(){var t=function(t,e){var r=t,n=a[e],o=null,i=0,u=null,v=[],y={},_=function(t,e){o=function(t){for(var e=new Array(t),r=0;r\u003ct;r+=1){e[r]=new Array(t);for(var n=0;n\u003ct;n+=1)e[r][n]=null}return e}(i=4*r+17),m(0,0),m(i-7,0),m(0,i-7),x(),b(),S(t,e),r>=7&&M(t),null==u&&(u=P(r,n,v)),C(u,e)},m=function(t,e){for(var r=-1;r\u003c=7;r+=1)if(!(t+r\u003c=-1||i\u003c=t+r))for(var n=-1;n\u003c=7;n+=1)e+n\u003c=-1||i\u003c=e+n||(o[t+r][e+n]=0\u003c=r&&r\u003c=6&&(0==n||6==n)||0\u003c=n&&n\u003c=6&&(0==r||6==r)||2\u003c=r&&r\u003c=4&&2\u003c=n&&n\u003c=4)},b=function(){for(var t=8;t\u003ci-8;t+=1)null==o[t][6]&&(o[t][6]=t%2==0);for(var e=8;e\u003ci-8;e+=1)null==o[6][e]&&(o[6][e]=e%2==0)},x=function(){for(var t=s.getPatternPosition(r),e=0;e\u003ct.length;e+=1)for(var n=0;n\u003ct.length;n+=1){var i=t[e],a=t[n];if(null==o[i][a])for(var u=-2;u\u003c=2;u+=1)for(var c=-2;c\u003c=2;c+=1)o[i+u][a+c]=-2==u||2==u||-2==c||2==c||0==u&&0==c}},M=function(t){for(var e=s.getBCHTypeNumber(r),n=0;n\u003c18;n+=1){var a=!t&&1==(e>>n&1);o[Math.floor(n/3)][n%3+i-8-3]=a}for(n=0;n\u003c18;n+=1)a=!t&&1==(e>>n&1),o[n%3+i-8-3][Math.floor(n/3)]=a},S=function(t,e){for(var r=n\u003c\u003c3|e,a=s.getBCHTypeInfo(r),u=0;u\u003c15;u+=1){var c=!t&&1==(a>>u&1);u\u003c6?o[ =========\n     QR CODE\n     ===================================================== */\n  var qrInput = $('qr-input'), qrStatus = $('qr-status'), qrCaption = $('qr-caption');\n  var qrExport = $('qr-export'), qrBox = $('qr-code');\n  var qrPlaceholder = $('qr-download-placeholder');\n  var qrDownload = makeDownloadButton(qrPlaceholder, 'qr-download');\n  var QR_SAMPLE = 'https://example.com';\n  var qr = { inst: null, text: QR_SAMPLE, generated: false, color: COLORS.forest.hex, pattern: 'rounded' };\n\n  var qrError = document.createElement('div');\n  qrError.className = 'field-error'; qrError.id = 'qr-error'; qrError.setAttribute('role', 'alert'); qrError.hidden = true;\n  qrError.innerHTML = '\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#i-alert\">\u003c/use>\u003c/svg>\u003cdiv>\u003cp id=\"qr-error-text\">\u003c/p>\u003c/div>';\n  qrInput.closest('.input-shell').insertAdjacentElement('afterend', qrError);\n\n  function showQrError(msg) {\n    $('qr-error-text').textContent = msg; qrError.hidden = false; qrInput.setAttribute('aria-invalid', 'true');\n  }\n  function clearQrError() { qrError.hidden = true; qrInput.removeAttribute('aria-invalid'); }\n\n  function qrOptions() {\n    var p = qr.pattern;\n    return {\n      width: 1024, height: 1024, type: 'svg', data: qr.text, margin: 128,\n      qrOptions: { errorCorrectionLevel: 'Q' },\n      dotsOptions: { color: qr.color, type: p },\n      backgroundOptions: { color: '#ffffff' },\n      cornersSquareOptions: { color: qr.color, type: p === 'dots' ? 'dot' : (p === 'rounded' ? 'extra-rounded' : 'square') },\n      cornersDotOptions: { color: qr.color, type: p === 'dots' ? 'dot' : 'square' }\n    };\n  }\n  function renderQr() {\n    if (typeof QRCodeStyling === 'undefined') return false;\n    try {\n      if (!qr.inst) qr.inst = new QRCodeStyling(qrOptions()); else qr.inst.update(qrOptions());\n      qrBox.innerHTML = '';\n      qr.inst.append(qrBox);\n      var svg = qrBox.querySelector('svg');\n ate').addEventListener('click', generateQr);\n  qrInput.addEventListener('keydown', function (e) {\n    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); generateQr(); }\n  });\n  qrInput.addEventListener('input', function () {\n    $('qr-count').textContent = plural(qrInput.value.length, 'character');\n    if (!qrError.hidden) clearQrError();\n    refreshQrStale();\n  });\n  bindSwatches('qr-colors', 'qr-color-name', function (hex) { qr.color = hex; renderQr(); });\n  $('qr-pattern').addEventListener('change', function (e) { qr.pattern = e.target.value; renderQr(); });\n  qrExport.addEventListener('change', function () {\n    updateQrDownloadLabel();\n    $('qr-resolution').textContent = qrExport.value === 'svg' ? 'Vector \\u00b7 Sharp at any size' : '1024 \\u00d7 1024 px \\u00b7 Print ready';\n  });\n  qrDownload.addEventListener('click', function () {\n    if (!qr.generated || !qr.inst) return;\n    var ext = qrExport.value;\n    Promise.resolve(qr.inst.download({ name: 'qr-' + slug(qr.text), extension: ext }))\n      .then(function () { toast('Downloaded your QR code as ' + ext.toUpperCase() + '.'); })\n      .catch(function (err) { console.error(err); toast('Download failed. Please try again.', 'error'); });\n  });\n\n  /* =====================================================\n     BARCODE\n     ===================================================== */\n  var bcInput = $('barcode-input'), bcFormat = $('barcode-format'), bcStatus = $('barcode-status');\n  var bcCaption = $('barcode-caption'), bcExport = $('barcode-export'), bcTextToggle = $('barcode-text');\n  var bcErr = $('barcode-error'), bcErrText = $('barcode-error-text');\n  var bcPlaceholder = $('barcode-download-placeholder'), bcDownload = $('barcode-download');\n  var BC_SAMPLES = { CODE128: 'qsdt45673a2d6', CODE39: 'QBAR-2026', EAN13: '5901234123457', UPC: '036000291452', ITF14: '15400141288763', PHARMACODE: '1234' };\n  var BC_HINTS = {\n    CODE128: 'The all-rounder. Handles letters, numbers and symbols.',\n    CODE39: 'Uppercase letters, numbers and - . $ / + % plus space.',\n    EAN13: 'Retail format. Enter 12 digits and the check digit is added for you.',\n    UPC: 'US retail format. Enter 11 digits and the check digit is added for you.',\n    ITF14: 'Cartons and cases. Enter 13 digits and the check digit is added for you.',\n    PHARMACODE: 'Pharmacy packaging. A whole number from 3 to 131070.'\n  };\n  var bc = { text: BC_SAMPLES.CODE128, generated: false, color: COLORS.ink.hex, shownFormat: 'CODE128' };\n\n  function updateBcHint() { $('barcode-hint').textContent = BC_HINTS[bcFormat.value]; }\n  function showBcError(msg, offerSwitch) {\n    bcErrText.textContent = msg;\n    $('barcode-use-code128').hidden = !(offerSwitch && bcFormat.value !== 'CODE128');\n    bcErr.hidden = false; bcInput.setAttribute('aria-invalid', 'true');\n  }\n  function clearBcError() { bcErr.hidden = true; bcInput.removeAttribute('aria-invalid'); }\n\n  function validateBarcode(text, fmt) {\n    if (!text) return 'Add some content first.';\n    var n;\n    switch (fmt) {\n      case 'CODE128':\n        if (!/^[\\x00-\\x7F]+$/.test(text)) return 'CODE128 supports standard keyboard characters only. Accented letters and emoji cannot be encoded.';\n        break;\n      case 'CODE39':\n        if (!/^[0-9A-Z\\-. $\\/+%]+$/i.test(text)) return 'CODE39 supports letters A to Z, numbers, space and - . $ / + % only.';\n        break;\n      case 'EAN13':\n        if (!/^\\d+$/.test(text)) return 'EAN-13 accepts digits only (0 to 9).';\n        if (text.length !== 12 && text.length !== 13) return 'EAN-13 needs 12 or 13 digits. You entered ' + text.length + '.';\n        break;\n      case 'UPC':\n        if (!/^\\d+$/.test(text)) return 'UPC-A accepts digits only (0 to 9).';\n        if (text.length !== 11 && text.length !== 12) return 'UPC-A needs 11 or 12 digits. You entered ' + text.length + '.';\n        break;\n      case 'ITF14':\n        if (!/^\\d+$/.test(text)) return 'ITF-14 accepts digits only (0 to 9).';\n        if (text.length !== 13 && text.length !== 14) return 'ITF-14 needs 13 or 14 digits. You entered ' + text.length + '.';\n        break;\n      case 'PHARMACODE':\n        n = parseInt(text, 10);\n        if (!/^\\d+$/.test(text) || isNaN(n) || n \u003c 3 || n > 131070) return 'Pharmacode needs a whole number from 3 to 131070.';\n        break;\n    }\n    return '';\n  }\n\n  /* Draw into a temporary SVG first so a failure never wipes the current preview. */\n  function drawBarcode(text, fmt) {\n    var tmp = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n    JsBarcode(tmp, text, {\n      format: fmt, lineColor: bc.color, background: '#ffffff',\n      width: 2, height: 90, margin: 14, fontSize: 16, textMargin: 6, font: 'monospace',\n      displayValue: bcTextToggle.checked\n    });\n    if (!tmp.getAttribute('viewBox')) {\n      var w = parseFloat(tmp.getAttribute('width')), h = parseFloat(tmp.getAttribute('height'));\n      if (w && h) tmp.setAttribute('viewBox', '0 0 ' + w + ' ' + h);\n    }\n    tmp.id = 'barcode-svg'; tmp.setAttribute('role', 'img'); tmp.setAttribute('aria-label', 'Barcode preview');\n    $('barcode-svg').replaceWith(tmp);\n    bc.shownFormat = fmt;\n    $('barcode-format-label').textContent = fmt === 'EAN13' ? 'EAN-13' : fmt === 'ITF14' ? 'ITF-14' : fmt === 'UPC' ? 'UPC-A' : fmt === 'PHARMACODE' ? 'PHARMACODE' : fmt;\n  }\n  function checkDigitHint(fmt) {\n    var d = { EAN13: 12, UPC: 11, ITF14: 13 }[fmt];\n    return d ? ' The check digit does not match. Enter ' + d + ' digits and it is added for you.' : '';\n  }\n  function tryRender(text, fmt) {\n    if (typeof JsBarcode === 'undefined') { toast('The barcode engine could not load. Check your connection.', 'error'); return false; }\n    var msg = validateBarcode(text, fmt);\n    if (msg) { showBcError(msg, true); setStatus(bcStatus, 'unavailable', 'Cannot encode'); return false; }\n    try { drawBarcode(text, fmt); clearBcError(); return true; }\n    catch (err) {\n      console.error(err);\n      showBcError('That value cannot be encoded as ' + fmt + '.' + checkDigitHint(fmt), true);\n      setStatus(bcStatus, 'unavailable', 'Cannot encode');\n      return false;\n    }\n  }\n  function renderBcSample() {\n    var fmt = bcFormat.value;\n    bc.text = BC_SAMPLES[fmt]; bc.generated = false;\n    try { drawBarcode(bc.text, fmt); } catch (e) { console.error(e); }\n    setStatus(bcStatus, '', 'Sample preview');\n    bcCaption.className = 'preview-caption';\n    bcCaption.textContent = 'A preview of what\\u2019s possible. Make it yours.';\n    bcPlaceholder.hidden = false; bcDownload.hidden = true;\n  }\n  function updateBcDownloadLabel() { $('barcode-download-text').textContent = 'Download ' + bcExport.value.toUpperCase(); }\n  function refreshBcStale() {\n    if (!bc.generated) return;\n    var stale = bcInput.value.trim() !== bc.text;\n    setStatus(bcStatus, stale ? 'stale' : 'ready', stale ? 'Needs update' : 'Ready');\n    bcCaption.className = 'preview-caption' + (stale ? ' is-stale' : '');\n    bcCaption.textContent = stale ? 'Content changed. Press Generate to update the preview.' : 'Looking good. Test it with a scanner before printing in bulk.';\n  }\n  function generateBarcode() {\n    var text = bcInput.value.trim();\n    var fmt = bcFormat.value;\n    if (!text) { showBcError('Add some numbers or letters first.', false); bcInput.focus(); toast('Add some content to turn into a barcode.', 'warning'); return; }\n    if (!tryRender(text, fmt)) { toast('That content does not fit this format.', 'warning'); return; }\n    bc.text = text; bc.generated = true;\n    setStatus(bcStatus, 'ready', 'Ready');\n    bcCaption.className = 'preview-caption';\n    bcCaption.textContent = 'Looking good. Test it with a scanner before printing in bulk.';\n    bcPlaceholder.hidden = true; bcDownload.hidden = false; updateBcDownloadLabel();\n    toast('Barcode ready to download.');\n  }\n  /* Re-draw after colour / format / text-toggle changes. */\n  function redrawBarcode() {\n    if (!bc.generated) { renderBcSample(); clearBcError(); return; }\n    var fmt = bcFormat.value;\n    if (tryRender(bc.text, fmt)) { setStatus(bcStatus, 'ready', 'Ready'); refreshBcStale(); }\n  }\n\n  $('barcode-form').addEventListener('submit', function (e) { e.preventDefault(); });\n  $('barcode-generate').addEventListener('click', generateBarcode);\n  bcInput.addEventListener('keydown', function (e) {\n    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); generateBarcode(); }\n  });\n  bcInput.addEventListener('input', function () {\n    $('barcode-count').textContent = plural(bcInput.value.length, 'character');\n    if (!bcErr.hidden) clearBcError();\n    refreshBcStale();\n  });\n  bcFormat.addEventListener('change', function () { updateBcHint(); redrawBarcode(); });\n  bcTextToggle.addEventListener('change', redrawBarcode);\n  bindSwatches('barcode-colors', 'barcode-color-name', function (hex) { bc.color = hex; redrawBarcode(); });\n  bcExport.addEventListener('change', function () { updateBcDownloadLabel(); });\n  $('barcode-use-code128').addEventListener('click', function () {\n    bcFormat.value = 'CODE128'; updateBcHint();\n    if (bcInput.value.trim()) generateBarcode(); else { clearBcError(); renderBcSample(); }\n  });\n\n  bcDownload.addEventListener('click', function () {\n    if (!bc.generated) return;\n    var svg = $('barcode-svg');\n    var xml = new XMLSerializer().serializeToString(svg);\n    if (!/^\u003csvg[^>]+xmlns=/.test(xml)) xml = xml.replace('\u003csvg', '\u003csvg xmlns=\"http://www.w3.org/2000/svg\"');\n    var name = 'barcode-' + slug(bc.text);\n    if (bcExport.value === 'svg') {\n      saveBlob(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }), name + '.svg');\n      toast('Downloaded your barcode as SVG.');\n      return;\n    }\n    var w = parseFloat(svg.getAttribute('width')) || 300, h = parseFloat(svg.getAttribute('height')) || 150;\n    var scale = Math.max(2, Math.ceil(1400 / w));\n    var img = new Image();\n    img.onload = function () {\n      var canvas = document.createElement('canvas');\n      canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);\n      var ctx = canvas.getContext('2d');\n      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);\n      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);\n      canvas.toBlob(function (blob) {\n        if (!blob) { toast('Download failed. Please try again.', 'error'); return; }\n        saveBlob(blob, name + '.png');\n        toast('Downloaded your barcode as PNG.');\n      }, 'image/png');\n    };\n    img.onerror = function () { toast('Download failed. Please try again.', 'error'); };\n    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);\n  });\n\n  /* ---------- example chips (both tools) ---------- */\n  document.querySelectorAll('.example-chip').forEach(function (chip) {\n    chip.addEventListener('click', function () {\n      var v = chip.dataset.value;\n      if (chip.dataset.exampleTool === 'barcode') {\n        bcInput.value = v; bcInput.dispatchEvent(new Event('input')); generateBarcode();\n      } else {\n        qrInput.value = v; qrInput.dispatchEvent(new Event('input')); generateQr();\n      }\n    });\n  });\n\n  /* ---------- dialogs ---------- */\n  var dialog = $('info-dialog');\n  document.querySelectorAll('[data-open-dialog]').forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      var tpl = $(btn.dataset.openDialog + '-template');\n      if (!tpl) return;\n      $('dialog-content').replaceChildren(tpl.content.cloneNode(true));\n      if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.setAttribute('open', '');\n    });\n  });\n  $('dialog-close').addEventListener('click', function () { dialog.close(); });\n  dialog.addEventListener('click', function (e) { if (e.target === dialog) dialog.close(); });\n\n  /* ---------- init ---------- */\n  $('year').textContent = new Date().getFullYear();\n  updateBcHint();\n  if (enginesOk) {\n    renderQr();\n    renderBcSample();\n  }\n})();\n\n\u003c/script>\n\u003c/body>\u003c/html>", dark: "\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>QBarCode Studio - All-in-One QR Code & Barcode Generator\u003c/title>\n  \n  \u003c!-- Google Fonts -->\n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n  \n  \u003c!-- FontAwesome Icons -->\n  \u003clink rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n  \n  \u003c!-- Tailwind CSS CDN -->\n  \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n  \n  \u003c!-- QR Code Styling CDN -->\n  \u003cscript type=\"text/javascript\" src=\"https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js\">\u003c/script>\n  \n  \u003c!-- JsBarcode CDN -->\n  \u003cscript src=\"https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js\">\u003c/script>\n  \n  \u003c!-- Canvas Confetti CDN -->\n  \u003cscript src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js\">\u003c/script>\n\n  \u003cscript>\n    tailwind.config = {\n      theme: {\n        extend: {\n          fontFamily: {\n            sans: ['Outfit', 'sans-serif'],\n          },\n          colors: {\n            brand: {\n              pink: '#FF2E93',\n              purple: '#FF007A',\n              violet: '#7000FF',\n              cyan: '#00F0FF',\n              yellow: '#FFDE00',\n              dark: '#0B0F19',\n              slate: '#121625'\n            }\n          },\n          animation: {\n            'float': 'float 4s ease-in-out infinite',\n            'glow': 'glow 2s ease-in-out infinite alternate',\n            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',\n          },\n          keyframes: {\n            float: {\n              '0%, 100%': { transform: 'translateY(0px)' },\n              '50%': { transform: 'translateY(-6px)' },\n            },\n            glow: {\n              '0%': { filter: 'drop-shadow(0 0 15px rgba(255, 46, 147, 0.4))' },\n              '100%': { filter: 'drop-shadow(0 0 25px rgba(112, 0, 255, 0.7))' }\n            }\n          }\n        }\n      }\n    }\n  \u003c/script>\n\n  \u003cstyle>\n    body {\n      font-family: 'Outfit', sans-serif;\n      background-color: #07090e;\n      background-image: \n        radial-gradient(at 10% 10%, rgba(255, 46, 147, 0.22) 0px, transparent 50%),\n        radial-gradient(at 90% 15%, rgba(112, 0, 255, 0.25) 0px, transparent 50%),\n        radial-gradient(at 50% 85%, rgba(0, 240, 255, 0.18) 0px, transparent 50%);\n      background-attachment: fixed;\n      min-height: 100vh;\n    }\n\n    /* Glassmorphism styling */\n    .glass-card {\n      background: rgba(18, 22, 37, 0.82);\n      backdrop-filter: blur(20px);\n      -webkit-backdrop-filter: blur(20px);\n      border: 1px solid rgba(255, 255, 255, 0.12);\n    }\n\n    .glass-input {\n      background: rgba(10, 13, 22, 0.65);\n      border: 1.5px solid rgba(255, 255, 255, 0.15);\n      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);\n    }\n\n    .glass-input:focus {\n      border-color: #00F0FF;\n      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);\n      outline: none;\n    }\n\n    /* Animated Gradient Button */\n    .btn-gradient {\n      background: linear-gradient(135deg, #FF2E93 0%, #7000FF 50%, #00F0FF 100%);\n      background-size: 200% 200%;\n      transition: all 0.4s ease;\n    }\n\n    .btn-gradient:hover:not(:disabled) {\n      background-position: 100% 0%;\n      transform: translateY(-2px);\n      box-shadow: 0 10px 25px -5px rgba(255, 46, 147, 0.5);\n    }\n\n    .btn-gradient:active:not(:disabled) {\n      transform: translateY(0);\n    }\n\n    /* Preset color option dots */\n    .color-option {\n      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;\n    }\n    .color-option:hover {\n      transform: scale(1.08);\n    }\n    .color-option.selected {\n      border-color: #00F0FF;\n      box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);\n    }\n\n    /* Glow wrapper for Code Output */\n    .code-glow {\n      position: relative;\n    }\n    .code-glow::before {\n      content: '';\n      position: absolute;\n      inset: -3px;\n      background: linear-gradient(45deg, #FF2E93, #7000FF, #00F0FF);\n      border-radius: 1.25rem;\n      z-index: -1;\n      opacity: 0;\n      transition: opacity 0.5s ease;\n      filter: blur(10px);\n    }\n    .code-glow.active::before {\n      opacity: 0.85;\n    }\n\n    /* Custom Toast Notification Animation */\n    @keyframes slideIn {\n      from { transform: translateY(-100%) scale(0.9); opacity: 0; }\n      to { transform: translateY(0) scale(1); opacity: 1; }\n    }\n    .toast-animate {\n      animation: slideIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;\n    }\n\n    /* Scrollbars */\n    ::-webkit-scrollbar {\n      width: 8px;\n    }\n    ::-webkit-scrollbar-track {\n      background: #0B0F19;\n    }\n    ::-webkit-scrollbar-thumb {\n      background: #2A334B;\n      border-radius: 4px;\n    }\n    ::-webkit-scrollbar-thumb:hover {\n      background: #00F0FF;\n    }\n\n    /* Tab transitions */\n    .tab-content {\n      display: none;\n      opacity: 0;\n      transition: opacity 0.3s ease-in-out;\n    }\n    .tab-content.active {\n      display: block;\n      opacity: 1;\n    }\n  \u003c/style>\n\u003c/head>\n\n\u003cbody class=\"text-slate-100 flex flex-col justify-between min-h-screen relative overflow-x-hidden p-3 sm:p-6 lg:p-8\">\n\n  \u003c!-- Toast Container -->\n  \u003cdiv id=\"toast-container\" class=\"fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-3 w-full max-w-sm pointer-events-none px-4\">\u003c/div>\n\n  \u003c!-- Background Decorative Glowing Orbs -->\n  \u003cdiv class=\"fixed -top-28 -left-28 w-96 h-96 bg-brand-pink/20 rounded-full blur-3xl pointer-events-none\">\u003c/div>\n  \u003cdiv class=\"fixed -bottom-28 -right-28 w-96 h-96 bg-brand-violet/20 rounded-full blur-3xl pointer-events-none\">\u003c/div>\n\n  \u003c!-- Main Container -->\n  \u003cmain class=\"w-full max-w-4xl mx-auto my-auto z-10\">\n\n    \u003c!-- Header & Branding -->\n    \u003cheader class=\"text-center mb-6 sm:mb-8\">\n      \u003cdiv class=\"inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass-card text-brand-cyan text-xs sm:text-sm font-semibold tracking-wide uppercase mb-3 border border-brand-cyan/30 shadow-lg shadow-brand-cyan/10 animate-float\">\n        \u003ci class=\"fa-solid fa-wand-magic-sparkles text-brand-yellow\">\u003c/i> All-in-One Generator\n      \u003c/div>\n      \u003ch1 class=\"text-3xl sm:text-5xl font-extrabold tracking-tight mb-2\">\n        \u003cspan class=\"bg-gradient-to-r from-brand-pink via-brand-violet to-brand-cyan bg-clip-text text-transparent\">\n          QBarCode Studio\n        \u003c/span>\n      \u003c/h1>\n      \u003cp class=\"text-slate-400 text-xs sm:text-base max-w-lg mx-auto font-normal\">\n        Instant, high-resolution QR codes & barcodes for URLs, text, and numbers. 100% Free & Unlimited.\n      \u003c/p>\n    \u003c/header>\n\n    \u003c!-- Main Studio Card -->\n    \u003cdiv class=\"glass-card rounded-3xl p-5 sm:p-8 md:p-10 shadow-2xl relative overflow-hidden\">\n\n      \u003c!-- Navigation Tabs Switcher -->\n      \u003cdiv class=\"flex items-center justify-center p-1.5 bg-slate-950/80 rounded-2xl border border-slate-800 mb-8 max-w-md mx-auto shadow-inner\">\n        \u003cbutton id=\"tab-btn-qr\" onclick=\"switchTab('qr')\" class=\"flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-300 bg-gradient-to-r from-brand-pink to-brand-violet text-white shadow-lg\">\n          \u003ci class=\"fa-solid fa-qrcode text-base\">\u003c/i>\n          \u003cspan>QR Code\u003c/span>\n        \u003c/button>\n        \u003cbutton id=\"tab-btn-barcode\" onclick=\"switchTab('barcode')\" class=\"flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-300 text-slate-400 hover:text-white\">\n          \u003ci class=\"fa-solid fa-barcode text-base\">\u003c/i>\n          \u003cspan>Barcode\u003c/span>\n        \u003c/button>\n      \u003c/div>\n\n      \u003c!-- ========================================================================= -->\n      \u003c!-- TAB 1: QR CODE GENERATOR -->\n      \u003c!-- ========================================================================= -->\n      \u003cdiv id=\"tab-qr\" class=\"tab-content active\">\n        \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-12 gap-8 items-start\">\n          \n          \u003c!-- Left Options Panel (7 cols) -->\n          \u003cdiv class=\"lg:col-span-7 space-y-5\">\n            \n            \u003c!-- Input Text/URL -->\n            \u003cdiv>\n              \u003cdiv class=\"flex items-center justify-between mb-2\">\n                \u003clabel for=\"qr-input\" class=\"text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5\">\n                  \u003ci class=\"fa-solid fa-link text-brand-pink\">\u003c/i> Content or Text\n                \u003c/label>\n                \u003cspan id=\"qr-input-type-badge\" class=\"text-[10px] bg-slate-800 text-brand-cyan px-2 py-0.5 rounded-full font-mono font-medium border border-slate-700\">\n                  Any Input Supported\n                \u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"relative\">\n                \u003cinput \n                  type=\"text\" \n                  id=\"qr-input\" \n                  placeholder=\"Enter URL, plain numbers (e.g. 12345), or mixed text (e.g. qsdt45673a2d6)...\" \n                  class=\"glass-input w-full px-4 py-3.5 pr-10 rounded-2xl text-slate-100 placeholder-slate-500 text-sm focus:ring-0\"\n                  autocomplete=\"off\"\n                  value=\"https://github.com\"\n                />\n                \u003cbutton id=\"qr-clear-btn\" class=\"hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors p-1\" title=\"Clear input\">\n                  \u003ci class=\"fa-solid fa-circle-xmark\">\u003c/i>\n                \u003c/button>\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Color Theme Selector -->\n            \u003cdiv>\n              \u003clabel class=\"block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2 flex items-center gap-1.5\">\n                \u003ci class=\"fa-solid fa-palette text-brand-violet\">\u003c/i> Color Style\n              \u003c/label>\n              \u003cdiv class=\"grid grid-cols-5 gap-2\">\n                \u003c!-- Classic Dark -->\n                \u003cbutton type=\"button\" data-qr-preset=\"classic\" class=\"qr-preset-btn color-option selected p-2 rounded-xl bg-slate-900 border-2 border-slate-700 flex flex-col items-center gap-1 group\">\n                  \u003cdiv class=\"w-full h-5 rounded bg-white border border-slate-300 flex items-center justify-center\">\n                    \u003cdiv class=\"w-2.5 h-2.5 bg-slate-900 rounded-sm\">\u003c/div>\n                  \u003c/div>\n                  \u003cspan class=\"text-[10px] text-slate-400 group-hover:text-white font-medium\">Classic\u003c/span>\n                \u003c/button>\n                \u003c!-- Cyber Neon -->\n                \u003cbutton type=\"button\" data-qr-preset=\"neon\" class=\"qr-preset-btn color-option p-2 rounded-xl bg-slate-900 border-2 border-slate-700 flex flex-col items-center gap-1 group\">\n                  \u003cdiv class=\"w-full h-5 rounded bg-slate-950 border border-brand-pink/50 flex items-center justify-center\">\n                    \u003cdiv class=\"w-2.5 h-2.5 bg-brand-pink rounded-sm\">\u003c/div>\n                  \u003c/div>\n                  \u003cspan class=\"text-[10px] text-slate-400 group-hover:text-white font-medium\">Cyber\u003c/span>\n                \u003c/button>\n                \u003c!-- Violet Glow -->\n                \u003cbutton type=\"button\" data-qr-preset=\"violet\" class=\"qr-preset-btn color-option p-2 rounded-xl bg-slate-900 border-2 border-slate-700 flex flex-col items-center gap-1 group\">\n                  \u003cdiv class=\"w-full h-5 rounded bg-white border border-brand-violet flex items-center justify-center\">\n                    \u003cdiv class=\"w-2.5 h-2.5 bg-brand-violet rounded-sm\">\u003c/div>\n                  \u003c/div>\n                  \u003cspan class=\"text-[10px] text-slate-400 group-hover:text-white font-medium\">Violet\u003c/span>\n                \u003c/button>\n                \u003c!-- Ocean Blue -->\n                \u003cbutton type=\"button\" data-qr-preset=\"ocean\" class=\"qr-preset-btn color-option p-2 rounded-xl bg-slate-900 border-2 border-slate-700 flex flex-col items-center gap-1 group\">\n                  \u003cdiv class=\"w-full h-5 rounded bg-cyan-950 border border-brand-cyan flex items-center justify-center\">\n                    \u003cdiv class=\"w-2.5 h-2.5 bg-brand-cyan rounded-sm\">\u003c/div>\n                  \u003c/div>\n                  \u003cspan class=\"text-[10px] text-slate-400 group-hover:text-white font-medium\">Ocean\u003c/span>\n                \u003c/button>\n                \u003c!-- Sunset Gold -->\n                \u003cbutton type=\"button\" data-qr-preset=\"sunset\" class=\"qr-preset-btn color-option p-2 rounded-xl bg-slate-900 border-2 border-slate-700 flex flex-col items-center gap-1 group\">\n                  \u003cdiv class=\"w-full h-5 rounded bg-amber-950 border border-amber-500 flex items-center justify-center\">\n                    \u003cdiv class=\"w-2.5 h-2.5 bg-amber-500 rounded-sm\">\u003c/div>\n                  \u003c/div>\n                  \u003cspan class=\"text-[10px] text-slate-400 group-hover:text-white font-medium\">Sunset\u003c/span>\n                \u003c/button>\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Dot Pattern Selector -->\n            \u003cdiv>\n              \u003clabel class=\"block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2 flex items-center gap-1.5\">\n                \u003ci class=\"fa-solid fa-shapes text-brand-cyan\">\u003c/i> Pattern Design\n              \u003c/label>\n              \u003cdiv class=\"grid grid-cols-3 gap-2.5\">\n                \u003cbutton type=\"button\" data-qr-style=\"rounded\" class=\"qr-style-btn active px-3 py-2 rounded-xl bg-slate-800/90 border border-brand-pink text-xs font-medium text-white transition-all text-center\">\n                  Rounded\n                \u003c/button>\n                \u003cbutton type=\"button\" data-qr-style=\"dots\" class=\"qr-style-btn px-3 py-2 rounded-xl bg-slate-900/60 border border-slate-700/60 text-xs font-medium text-slate-400 hover:text-white transition-all text-center\">\n                  Dots\n                \u003c/button>\n                \u003cbutton type=\"button\" data-qr-style=\"square\" class=\"qr-style-btn px-3 py-2 rounded-xl bg-slate-900/60 border border-slate-700/60 text-xs font-medium text-slate-400 hover:text-white transition-all text-center\">\n                  Sharp\n                \u003c/button>\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Export Format Selector -->\n            \u003cdiv>\n              \u003clabel for=\"qr-format\" class=\"block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2 flex items-center gap-1.5\">\n                \u003ci class=\"fa-solid fa-file-export text-brand-yellow\">\u003c/i> Format\n              \u003c/label>\n              \u003cdiv class=\"relative\">\n                \u003cselect id=\"qr-format\" class=\"glass-input w-full px-4 py-3 rounded-2xl text-slate-100 text-sm appearance-none cursor-pointer\">\n                  \u003coption value=\"png\" class=\"bg-slate-900 text-white\">PNG - High Resolution Image\u003c/option>\n                  \u003coption value=\"svg\" class=\"bg-slate-900 text-white\">SVG - Scalable Vector Graphic\u003c/option>\n                \u003c/select>\n                \u003ci class=\"fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs\">\u003c/i>\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Action Button -->\n            \u003cdiv class=\"pt-2\">\n              \u003cbutton id=\"qr-generate-btn\" class=\"btn-gradient w-full py-4 px-6 rounded-2xl font-bold text-white text-base tracking-wide shadow-xl flex items-center justify-center gap-2 group\">\n                \u003ci class=\"fa-solid fa-bolt transition-transform group-hover:scale-125 text-brand-yellow\">\u003c/i>\n                \u003cspan>Generate QR Code\u003c/span>\n              \u003c/button>\n            \u003c/div>\n\n          \u003c/div>\n\n          \u003c!-- Right Preview Panel (5 cols) -->\n          \u003cdiv class=\"lg:col-span-5 flex flex-col items-center justify-center space-y-5\">\n            \u003cdiv class=\"w-full flex flex-col items-center justify-center p-6 bg-slate-900/90 rounded-3xl border border-slate-800 shadow-inner\">\n              \n              \u003cdiv id=\"qr-glow-wrapper\" class=\"code-glow p-4 bg-white rounded-2xl shadow-2xl flex items-center justify-center min-h-[220px] min-w-[220px]\">\n                \u003cdiv id=\"qr-placeholder\" class=\"flex flex-col items-center justify-center text-center p-6 text-slate-400 space-y-2\">\n                  \u003ci class=\"fa-solid fa-qrcode text-4xl text-slate-300 mb-1\">\u003c/i>\n                  \u003cp class=\"text-xs font-semibold text-slate-500 uppercase tracking-wider\">Preview Area\u003c/p>\n                  \u003cp class=\"text-xs text-slate-400\">Click generate to render QR code\u003c/p>\n                \u003c/div>\n                \u003cdiv id=\"qr-canvas-container\" class=\"hidden\">\u003c/div>\n              \u003c/div>\n\n              \u003c!-- Ready Badge -->\n              \u003cdiv id=\"qr-status\" class=\"mt-4 opacity-0 transition-opacity duration-300 flex items-center gap-2 text-xs font-medium text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20\">\n                \u003ci class=\"fa-solid fa-circle-check\">\u003c/i> Scannable & Vector Ready\n              \u003c/div>\n\n            \u003c/div>\n\n            \u003c!-- Download Button -->\n            \u003cdiv id=\"qr-download-container\" class=\"w-full hidden space-y-2\">\n              \u003cbutton id=\"qr-download-btn\" class=\"w-full py-3.5 px-6 rounded-2xl font-bold text-slate-900 bg-brand-cyan hover:bg-cyan-300 transition-all duration-200 shadow-lg shadow-brand-cyan/20 flex items-center justify-center gap-2 text-sm\">\n                \u003ci class=\"fa-solid fa-download\">\u003c/i>\n                \u003cspan id=\"qr-download-text\">Download QR Code (PNG)\u003c/span>\n              \u003c/button>\n            \u003c/div>\n          \u003c/div>\n\n        \u003c/div>\n      \u003c/div>\n\n\n      \u003c!-- ========================================================================= -->\n      \u003c!-- TAB 2: BARCODE GENERATOR -->\n      \u003c!-- ========================================================================= -->\n      \u003cdiv id=\"tab-barcode\" class=\"tab-content\">\n        \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-12 gap-8 items-start\">\n          \n          \u003c!-- Left Options Panel (7 cols) -->\n          \u003cdiv class=\"lg:col-span-7 space-y-5\">\n            \n            \u003c!-- Input Field -->\n            \u003cdiv>\n              \u003cdiv class=\"flex items-center justify-between mb-2\">\n                \u003clabel for=\"barcode-input\" class=\"text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5\">\n                  \u003ci class=\"fa-solid fa-barcode text-brand-cyan\">\u003c/i> Barcode Content\n                \u003c/label>\n                \u003cspan id=\"barcode-type-badge\" class=\"text-[10px] bg-slate-800 text-brand-pink px-2 py-0.5 rounded-full font-mono font-medium border border-slate-700\">\n                  CODE128 Alphanumeric\n                \u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"relative\">\n                \u003cinput \n                  type=\"text\" \n                  id=\"barcode-input\" \n                  placeholder=\"Enter numbers (e.g. 12345) or alphanumeric code (e.g. qsdt45673a2d6)...\" \n                  class=\"glass-input w-full px-4 py-3.5 pr-10 rounded-2xl text-slate-100 placeholder-slate-500 text-sm focus:ring-0\"\n                  autocomplete=\"off\"\n                  value=\"qsdt45673a2d6\"\n                />\n                \u003cbutton id=\"barcode-clear-btn\" class=\"hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors p-1\" title=\"Clear input\">\n                  \u003ci class=\"fa-solid fa-circle-xmark\">\u003c/i>\n                \u003c/button>\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Incompatibility Alert Banner (Hidden by default) -->\n            \u003cdiv id=\"barcode-warning-banner\" class=\"hidden p-3.5 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-200 text-xs space-y-2\">\n              \u003cdiv class=\"flex items-start gap-2.5\">\n                \u003ci class=\"fa-solid fa-triangle-exclamation text-amber-400 text-base shrink-0 mt-0.5\">\u003c/i>\n                \u003cdiv>\n                  \u003cp class=\"font-bold\" id=\"barcode-warning-title\">Format Mismatch Detected\u003c/p>\n                  \u003cp class=\"text-amber-300/80 mt-0.5\" id=\"barcode-warning-msg\">\n                    This format requires strict numeric digits. CODE128 supports letters & numbers seamlessly!\n                  \u003c/p>\n                \u003c/div>\n              \u003c/div>\n              \u003cbutton type=\"button\" id=\"auto-fix-code128-btn\" class=\"w-full py-1.5 px-3 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-200 font-semibold text-xs border border-amber-500/40 transition-colors flex items-center justify-center gap-1.5\">\n                \u003ci class=\"fa-solid fa-wand-magic-sparkles\">\u003c/i> Switch to CODE128 (Recommended)\n              \u003c/button>\n            \u003c/div>\n\n            \u003c!-- Format Selector -->\n            \u003cdiv>\n              \u003clabel for=\"barcode-format-select\" class=\"block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2 flex items-center gap-1.5\">\n                \u003ci class=\"fa-solid fa-sliders text-brand-violet\">\u003c/i> Barcode Format\n              \u003c/label>\n              \u003cdiv class=\"relative\">\n                \u003cselect id=\"barcode-format-select\" class=\"glass-input w-full px-4 py-3 rounded-2xl text-slate-100 text-sm appearance-none cursor-pointer\">\n                  \u003coption value=\"CODE128\" selected class=\"bg-slate-900 text-white\">CODE128 (Default - Letters, Numbers, Symbols)\u003c/option>\n                  \u003coption value=\"CODE39\" class=\"bg-slate-900 text-white\">CODE39 (Uppercase Letters & Numbers)\u003c/option>\n                  \u003coption value=\"EAN13\" class=\"bg-slate-900 text-white\">EAN-13 (Strict 12 or 13 Digits)\u003c/option>\n                  \u003coption value=\"UPC\" class=\"bg-slate-900 text-white\">UPC-A (Strict 11 or 12 Digits)\u003c/option>\n                  \u003coption value=\"ITF14\" class=\"bg-slate-900 text-white\">ITF-14 (Strict 14 Digits)\u003c/option>\n                  \u003coption value=\"PHARMACODE\" class=\"bg-slate-900 text-white\">Pharmacode (Numeric 3 to 131070)\u003c/option>\n                \u003c/select>\n                \u003ci class=\"fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs\">\u003c/i>\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Barcode Customizer Settings Grid -->\n            \u003cdiv class=\"grid grid-cols-2 gap-4\">\n              \u003c!-- Color picker / Preset -->\n              \u003cdiv>\n                \u003clabel class=\"block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2\">\n                  Bar Color\n                \u003c/label>\n                \u003cdiv class=\"flex items-center gap-2 bg-slate-900/80 p-2 rounded-xl border border-slate-700/60\">\n                  \u003cinput type=\"color\" id=\"barcode-color\" value=\"#0f172a\" class=\"w-8 h-8 rounded cursor-pointer bg-transparent border-0\">\n                  \u003cspan class=\"text-xs text-slate-300 font-mono\" id=\"barcode-color-hex\">#0f172a\u003c/span>\n                \u003c/div>\n              \u003c/div>\n\n              \u003c!-- Display Value Toggle -->\n              \u003cdiv>\n                \u003clabel class=\"block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2\">\n                  Human Readable Text\n                \u003c/label>\n                \u003clabel class=\"flex items-center gap-2 bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/60 cursor-pointer\">\n                  \u003cinput type=\"checkbox\" id=\"barcode-show-text\" checked class=\"w-4 h-4 rounded text-brand-pink focus:ring-0 cursor-pointer\">\n                  \u003cspan class=\"text-xs font-medium text-slate-300\">Show Text Below\u003c/span>\n                \u003c/label>\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Bar Height Slider -->\n            \u003cdiv>\n              \u003cdiv class=\"flex justify-between items-center mb-1\">\n                \u003clabel for=\"barcode-height\" class=\"text-xs font-bold uppercase tracking-wider text-slate-300\">\n                  Barcode Height\n                \u003c/label>\n                \u003cspan id=\"barcode-height-val\" class=\"text-xs font-mono text-brand-cyan\">70px\u003c/span>\n              \u003c/div>\n              \u003cinput type=\"range\" id=\"barcode-height\" min=\"30\" max=\"150\" value=\"70\" class=\"w-full accent-brand-cyan bg-slate-800 rounded-lg cursor-pointer\">\n            \u003c/div>\n\n            \u003c!-- Export Format Selector -->\n            \u003cdiv>\n              \u003clabel for=\"barcode-export-format\" class=\"block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2 flex items-center gap-1.5\">\n                \u003ci class=\"fa-solid fa-file-export text-brand-yellow\">\u003c/i> Export Format\n              \u003c/label>\n              \u003cdiv class=\"relative\">\n                \u003cselect id=\"barcode-export-format\" class=\"glass-input w-full px-4 py-3 rounded-2xl text-slate-100 text-sm appearance-none cursor-pointer\">\n                  \u003coption value=\"png\" class=\"bg-slate-900 text-white\">PNG - High Resolution Image\u003c/option>\n                  \u003coption value=\"svg\" class=\"bg-slate-900 text-white\">SVG - Scalable Vector Graphic\u003c/option>\n                \u003c/select>\n                \u003ci class=\"fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs\">\u003c/i>\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Action Button -->\n            \u003cdiv class=\"pt-2\">\n              \u003cbutton id=\"barcode-generate-btn\" class=\"btn-gradient w-full py-4 px-6 rounded-2xl font-bold text-white text-base tracking-wide shadow-xl flex items-center justify-center gap-2 group\">\n                \u003ci class=\"fa-solid fa-barcode transition-transform group-hover:scale-110 text-brand-yellow\">\u003c/i>\n                \u003cspan>Generate Barcode\u003c/span>\n              \u003c/button>\n            \u003c/div>\n\n          \u003c/div>\n\n          \u003c!-- Right Preview Panel (5 cols) -->\n          \u003cdiv class=\"lg:col-span-5 flex flex-col items-center justify-center space-y-5\">\n            \u003cdiv class=\"w-full flex flex-col items-center justify-center p-6 bg-slate-900/90 rounded-3xl border border-slate-800 shadow-inner min-h-[280px]\">\n              \n              \u003cdiv id=\"barcode-glow-wrapper\" class=\"code-glow p-4 bg-white rounded-2xl shadow-2xl flex items-center justify-center w-full max-w-full overflow-x-auto min-h-[160px]\">\n                \u003cdiv id=\"barcode-placeholder\" class=\"flex flex-col items-center justify-center text-center p-6 text-slate-400 space-y-2\">\n                  \u003ci class=\"fa-solid fa-barcode text-4xl text-slate-300 mb-1\">\u003c/i>\n                  \u003cp class=\"text-xs font-semibold text-slate-500 uppercase tracking-wider\">Preview Area\u003c/p>\n                  \u003cp class=\"text-xs text-slate-400\">Barcode will render here\u003c/p>\n                \u003c/div>\n                \u003c!-- Render target SVG -->\n                \u003csvg id=\"barcode-svg\" class=\"hidden max-w-full\">\u003c/svg>\n              \u003c/div>\n\n              \u003c!-- Ready Badge -->\n              \u003cdiv id=\"barcode-status\" class=\"mt-4 opacity-0 transition-opacity duration-300 flex items-center gap-2 text-xs font-medium text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20\">\n                \u003ci class=\"fa-solid fa-circle-check\">\u003c/i> High-Clarity Barcode Generated\n              \u003c/div>\n\n            \u003c/div>\n\n            \u003c!-- Download Button -->\n            \u003cdiv id=\"barcode-download-container\" class=\"w-full hidden space-y-2\">\n              \u003cbutton id=\"barcode-download-btn\" class=\"w-full py-3.5 px-6 rounded-2xl font-bold text-slate-900 bg-brand-cyan hover:bg-cyan-300 transition-all duration-200 shadow-lg shadow-brand-cyan/20 flex items-center justify-center gap-2 text-sm\">\n                \u003ci class=\"fa-solid fa-download\">\u003c/i>\n                \u003cspan id=\"barcode-download-text\">Download Barcode (PNG)\u003c/span>\n              \u003c/button>\n            \u003c/div>\n          \u003c/div>\n\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n\n    \u003c!-- Footer Information -->\n    \u003cfooter class=\"mt-8 text-center text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-4 px-2\">\n      \u003cp>\u00a9 \u003cspan id=\"year\">\u003c/span> QBarCode Studio. Built with Pure JavaScript & Web Standards.\u003c/p>\n      \u003cdiv class=\"flex items-center gap-4\">\n        \u003cspan class=\"hover:text-slate-400 transition-colors cursor-pointer\">\n          \u003ci class=\"fa-solid fa-shield-halved text-brand-pink mr-1\">\u003c/i> Privacy First (100% Client-Side)\n        \u003c/span>\n        \u003cspan class=\"hover:text-slate-400 transition-colors cursor-pointer\">\n          \u003ci class=\"fa-solid fa-infinity text-brand-yellow mr-1\">\u003c/i> Unlimited Free\n        \u003c/span>\n      \u003c/div>\n    \u003c/footer>\n\n  \u003c/main>\n\n  \u003c!-- JS Logic -->\n  \u003cscript>\n    document.addEventListener('DOMContentLoaded', () => {\n\n      // Set copyright year\n      document.getElementById('year').textContent = new Date().getFullYear();\n\n      // Color Theme Presets for QR Code\n      const QR_PRESETS = {\n        classic: { dots: '#0f172a', bg: '#ffffff', corners: '#0f172a' },\n        neon:    { dots: '#FF2E93', bg: '#090d16', corners: '#00F0FF' },\n        violet:  { dots: '#7000FF', bg: '#ffffff', corners: '#FF007A' },\n        ocean:   { dots: '#00F0FF', bg: '#061325', corners: '#3b82f6' },\n        sunset:  { dots: '#f59e0b', bg: '#1c100b', corners: '#ef4444' }\n      };\n\n      // State Variables\n      let activeTab = 'qr';\n      let currentQrPreset = 'classic';\n      let currentQrStyle = 'rounded';\n      let qrCodeInstance = null;\n      let isQrGenerated = false;\n      let isBarcodeGenerated = false;\n\n      // DOM Elements - Tabs\n      const tabBtnQr = document.getElementById('tab-btn-qr');\n      const tabBtnBarcode = document.getElementById('tab-btn-barcode');\n      const tabQr = document.getElementById('tab-qr');\n      const tabBarcode = document.getElementById('tab-barcode');\n\n      // DOM Elements - QR\n      const qrInput = document.getElementById('qr-input');\n      const qrClearBtn = document.getElementById('qr-clear-btn');\n      const qrFormatSelect = document.getElementById('qr-format');\n      const qrGenerateBtn = document.getElementById('qr-generate-btn');\n      const qrDownloadBtn = document.getElementById('qr-download-btn');\n      const qrDownloadText = document.getElementById('qr-download-text');\n      const qrDownloadContainer = document.getElementById('qr-download-container');\n      const qrPlaceholder = document.getElementById('qr-placeholder');\n      const qrCanvasContainer = document.getElementById('qr-canvas-container');\n      const qrGlowWrapper = document.getElementById('qr-glow-wrapper');\n      const qrStatus = document.getElementById('qr-status');\n      const qrPresetBtns = document.querySelectorAll('.qr-preset-btn');\n      const qrStyleBtns = document.querySelectorAll('.qr-style-btn');\n\n      // DOM Elements - Barcode\n      const barcodeInput = document.getElementById('barcode-input');\n      const barcodeClearBtn = document.getElementById('barcode-clear-btn');\n      const barcodeFormatSelect = document.getElementById('barcode-format-select');\n      const barcodeColorInput = document.getElementById('barcode-color');\n      const barcodeColorHex = document.getElementById('barcode-color-hex');\n      const barcodeShowText = document.getElementById('barcode-show-text');\n      const barcodeHeightInput = document.getElementById('barcode-height');\n      const barcodeHeightVal = document.getElementById('barcode-height-val');\n      const barcodeExportFormat = document.getElementById('barcode-export-format');\n      const barcodeGenerateBtn = document.getElementById('barcode-generate-btn');\n      const barcodeDownloadBtn = document.getElementById('barcode-download-btn');\n      const barcodeDownloadText = document.getElementById('barcode-download-text');\n      const barcodeDownloadContainer = document.getElementById('barcode-download-container');\n      const barcodePlaceholder = document.getElementById('barcode-placeholder');\n      const barcodeSvg = document.getElementById('barcode-svg');\n      const barcodeGlowWrapper = document.getElementById('barcode-glow-wrapper');\n      const barcodeStatus = document.getElementById('barcode-status');\n      const barcodeTypeBadge = document.getElementById('barcode-type-badge');\n      const barcodeWarningBanner = document.getElementById('barcode-warning-banner');\n      const barcodeWarningMsg = document.getElementById('barcode-warning-msg');\n      const autoFixCode128Btn = document.getElementById('auto-fix-code128-btn');\n      const toastContainer = document.getElementById('toast-container');\n\n      // Global Tab Switcher Function\n      window.switchTab = function(tab) {\n        activeTab = tab;\n        if (tab === 'qr') {\n          tabBtnQr.className = \"flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-300 bg-gradient-to-r from-brand-pink to-brand-violet text-white shadow-lg\";\n          tabBtnBarcode.className = \"flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-300 text-slate-400 hover:text-white\";\n          tabQr.classList.add('active');\n          tabBarcode.classList.remove('active');\n        } else {\n          tabBtnBarcode.className = \"flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-300 bg-gradient-to-r from-brand-violet to-brand-cyan text-white shadow-lg\";\n          tabBtnQr.className = \"flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-300 text-slate-400 hover:text-white\";\n          tabBarcode.classList.add('active');\n          tabQr.classList.remove('active');\n          // Auto trigger initial barcode rendering\n          if (!isBarcodeGenerated) {\n            handleGenerateBarcode(false);\n          }\n        }\n      };\n\n      // --- INITIAL SETUP ---\n      initQrCodeInstance();\n      handleGenerateQR(false); // Initial generation\n\n      // --- EVENT LISTENERS: QR CODE ---\n      qrInput.addEventListener('input', () => {\n        if (qrInput.value.trim().length > 0) qrClearBtn.classList.remove('hidden');\n        else qrClearBtn.classList.add('hidden');\n      });\n\n      qrClearBtn.addEventListener('click', () => {\n        qrInput.value = '';\n        qrClearBtn.classList.add('hidden');\n        qrInput.focus();\n      });\n\n      qrInput.addEventListener('keypress', (e) => {\n        if (e.key === 'Enter') handleGenerateQR(true);\n      });\n\n      qrGenerateBtn.addEventListener('click', () => handleGenerateQR(true));\n      qrDownloadBtn.addEventListener('click', handleDownloadQR);\n\n      qrFormatSelect.addEventListener('change', () => {\n        const ext = qrFormatSelect.value.toUpperCase();\n        qrDownloadText.textContent = `Download QR Code (${ext})`;\n      });\n\n      qrPresetBtns.forEach(btn => {\n        btn.addEventListener('click', () => {\n          qrPresetBtns.forEach(b => b.classList.remove('selected'));\n          btn.classList.add('selected');\n          currentQrPreset = btn.getAttribute('data-qr-preset');\n          if (isQrGenerated) updateQrOptions();\n        });\n      });\n\n      qrStyleBtns.forEach(btn => {\n        btn.addEventListener('click', () => {\n          qrStyleBtns.forEach(b => {\n            b.classList.remove('active', 'border-brand-pink', 'text-white', 'bg-slate-800/90');\n            b.classList.add('border-slate-700/60', 'text-slate-400', 'bg-slate-900/60');\n          });\n          btn.classList.add('active', 'border-brand-pink', 'text-white', 'bg-slate-800/90');\n          btn.classList.remove('border-slate-700/60', 'text-slate-400', 'bg-slate-900/60');\n          currentQrStyle = btn.getAttribute('data-qr-style');\n          if (isQrGenerated) updateQrOptions();\n        });\n      });\n\n\n      // --- EVENT LISTENERS: BARCODE ---\n      barcodeInput.addEventListener('input', () => {\n        if (barcodeInput.value.trim().length > 0) barcodeClearBtn.classList.remove('hidden');\n        else barcodeClearBtn.classList.add('hidden');\n        validateBarcodeFormat();\n      });\n\n      barcodeClearBtn.addEventListener('click', () => {\n        barcodeInput.value = '';\n        barcodeClearBtn.classList.add('hidden');\n        barcodeInput.focus();\n      });\n\n      barcodeInput.addEventListener('keypress', (e) => {\n        if (e.key === 'Enter') handleGenerateBarcode(true);\n      });\n\n      barcodeFormatSelect.addEventListener('change', () => {\n        const fmt = barcodeFormatSelect.value;\n        barcodeTypeBadge.textContent = fmt;\n        validateBarcodeFormat();\n        if (isBarcodeGenerated) handleGenerateBarcode(false);\n      });\n\n      barcodeColorInput.addEventListener('input', () => {\n        barcodeColorHex.textContent = barcodeColorInput.value;\n        if (isBarcodeGenerated) handleGenerateBarcode(false);\n      });\n\n      barcodeShowText.addEventListener('change', () => {\n        if (isBarcodeGenerated) handleGenerateBarcode(false);\n      });\n\n      barcodeHeightInput.addEventListener('input', () => {\n        barcodeHeightVal.textContent = barcodeHeightInput.value + 'px';\n        if (isBarcodeGenerated) handleGenerateBarcode(false);\n      });\n\n      barcodeExportFormat.addEventListener('change', () => {\n        const ext = barcodeExportFormat.value.toUpperCase();\n        barcodeDownloadText.textContent = `Download Barcode (${ext})`;\n      });\n\n      barcodeGenerateBtn.addEventListener('click', () => handleGenerateBarcode(true));\n      barcodeDownloadBtn.addEventListener('click', handleDownloadBarcode);\n\n      autoFixCode128Btn.addEventListener('click', () => {\n        barcodeFormatSelect.value = 'CODE128';\n        barcodeTypeBadge.textContent = 'CODE128';\n        barcodeWarningBanner.classList.add('hidden');\n        showToast('Switched to CODE128 format!', 'info');\n        handleGenerateBarcode(true);\n      });\n\n\n      // ==========================================\n      // FUNCTIONS: QR CODE GENERATOR\n      // ==========================================\n      function initQrCodeInstance() {\n        const theme = QR_PRESETS[currentQrPreset];\n        qrCodeInstance = new QRCodeStyling({\n          width: 220,\n          height: 220,\n          type: \"svg\",\n          data: qrInput.value.trim() || \"https://github.com\",\n          margin: 6,\n          qrOptions: { typeNumber: 0, mode: \"Byte\", errorCorrectionLevel: \"Q\" },\n          dotsOptions: { color: theme.dots, type: currentQrStyle },\n          backgroundOptions: { color: theme.bg },\n          cornersSquareOptions: { \n            color: theme.corners, \n            type: currentQrStyle === 'dots' ? 'dot' : (currentQrStyle === 'rounded' ? 'extra-rounded' : 'square') \n          },\n          cornersDotOptions: { \n            color: theme.corners, \n            type: currentQrStyle === 'dots' ? 'dot' : 'square' \n          }\n        });\n      }\n\n      function updateQrOptions() {\n        const theme = QR_PRESETS[currentQrPreset];\n        const val = qrInput.value.trim();\n        qrCodeInstance.update({\n          data: val,\n          dotsOptions: { color: theme.dots, type: currentQrStyle },\n          backgroundOptions: { color: theme.bg },\n          cornersSquareOptions: { \n            color: theme.corners, \n            type: currentQrStyle === 'dots' ? 'dot' : (currentQrStyle === 'rounded' ? 'extra-rounded' : 'square') \n          },\n          cornersDotOptions: { \n            color: theme.corners, \n            type: currentQrStyle === 'dots' ? 'dot' : 'square' \n          }\n        });\n      }\n\n      function handleGenerateQR(showNotification = true) {\n        const val = qrInput.value.trim();\n        if (!val) {\n          showToast('Please enter text or a URL for the QR code!', 'warning');\n          qrInput.focus();\n          return;\n        }\n\n        updateQrOptions();\n        qrCanvasContainer.innerHTML = '';\n        qrCodeInstance.append(qrCanvasContainer);\n\n        qrPlaceholder.classList.add('hidden');\n        qrCanvasContainer.classList.remove('hidden');\n        qrDownloadContainer.classList.remove('hidden');\n        qrGlowWrapper.classList.add('active');\n        qrStatus.classList.remove('opacity-0');\n        qrStatus.classList.add('opacity-100');\n\n        isQrGenerated = true;\n\n        if (showNotification) {\n          triggerConfetti();\n          showToast('QR Code generated successfully!', 'success');\n        }\n      }\n\n      function handleDownloadQR() {\n        if (!isQrGenerated) return;\n        const format = qrFormatSelect.value;\n        const cleanName = sanitizeFilename(qrInput.value.trim() || 'qr-code');\n        qrCodeInstance.download({ name: `qr-${cleanName}`, extension: format });\n        showToast(`Downloaded QR Code as ${format.toUpperCase()}!`, 'success');\n      }\n\n\n      // ==========================================\n      // FUNCTIONS: BARCODE GENERATOR\n      // ==========================================\n      function validateBarcodeFormat() {\n        const text = barcodeInput.value.trim();\n        const format = barcodeFormatSelect.value;\n        let isValid = true;\n        let warningText = '';\n\n        if (!text) {\n          barcodeWarningBanner.classList.add('hidden');\n          return true;\n        }\n\n        if (format === 'EAN13') {\n          if (!/^\\d+$/.test(text)) {\n            isValid = false;\n            warningText = 'EAN-13 allows NUMERIC digits only (0-9). Mixed text like letters will fail.';\n          } else if (text.length !== 12 && text.length !== 13) {\n            isValid = false;\n            warningText = `EAN-13 requires exactly 12 or 13 digits (you entered ${text.length} digits).`;\n          }\n        } else if (format === 'UPC') {\n          if (!/^\\d+$/.test(text)) {\n            isValid = false;\n            warningText = 'UPC format allows NUMERIC digits only (0-9).';\n          } else if (text.length !== 11 && text.length !== 12) {\n            isValid = false;\n            warningText = `UPC requires exactly 11 or 12 digits (you entered ${text.length} digits).`;\n          }\n        } else if (format === 'ITF14') {\n          if (!/^\\d+$/.test(text) || text.length !== 14) {\n            isValid = false;\n            warningText = 'ITF-14 requires exactly 14 numeric digits.';\n          }\n        } else if (format === 'PHARMACODE') {\n          const num = parseInt(text, 10);\n          if (!/^\\d+$/.test(text) || isNaN(num) || num \u003c 3 || num > 131070) {\n            isValid = false;\n            warningText = 'Pharmacode requires a number between 3 and 131070.';\n          }\n        } else if (format === 'CODE39') {\n          if (!/^[0-9A-Z\\-.\\ \\$\\/\\+\\%]+$/i.test(text)) {\n            isValid = false;\n            warningText = 'CODE39 supports numbers, uppercase letters, and symbols (- . $ / + % space).';\n          }\n        }\n\n        if (!isValid) {\n          barcodeWarningMsg.textContent = warningText;\n          barcodeWarningBanner.classList.remove('hidden');\n        } else {\n          barcodeWarningBanner.classList.add('hidden');\n        }\n\n        return isValid;\n      }\n\n      function handleGenerateBarcode(showNotification = true) {\n        const text = barcodeInput.value.trim();\n        if (!text) {\n          showToast('Please enter numbers or letters for barcode!', 'warning');\n          barcodeInput.focus();\n          return;\n        }\n\n        const format = barcodeFormatSelect.value;\n        const color = barcodeColorInput.value;\n        const showText = barcodeShowText.checked;\n        const height = parseInt(barcodeHeightInput.value, 10);\n\n        // Validate\n        const isValid = validateBarcodeFormat();\n        if (!isValid) {\n          if (showNotification) {\n            showToast('Format mismatch! Check warning banner or switch to CODE128.', 'warning');\n          }\n          return;\n        }\n\n        try {\n          // Clear previous\n          barcodeSvg.innerHTML = '';\n          barcodeSvg.classList.remove('hidden');\n          barcodePlaceholder.classList.add('hidden');\n\n          JsBarcode(\"#barcode-svg\", text, {\n            format: format,\n            lineColor: color,\n            background: \"#ffffff\",\n            width: 2,\n            height: height,\n            displayValue: showText,\n            fontSize: 14,\n            margin: 12\n          });\n\n          barcodeDownloadContainer.classList.remove('hidden');\n          barcodeGlowWrapper.classList.add('active');\n          barcodeStatus.classList.remove('opacity-0');\n          barcodeStatus.classList.add('opacity-100');\n\n          isBarcodeGenerated = true;\n\n          if (showNotification) {\n            triggerConfetti();\n            showToast('Barcode generated successfully!', 'success');\n          }\n\n        } catch (err) {\n          console.error(\"Barcode Render Error:\", err);\n          showToast(`Error generating ${format}. Consider using CODE128.`, 'error');\n        }\n      }\n\n      function handleDownloadBarcode() {\n        if (!isBarcodeGenerated) return;\n\n        const format = barcodeExportFormat.value;\n        const textVal = barcodeInput.value.trim() || 'barcode';\n        const cleanName = sanitizeFilename(textVal);\n        const fileName = `barcode-${cleanName}`;\n\n        if (format === 'svg') {\n          // Export SVG directly\n          const svgData = new XMLSerializer().serializeToString(barcodeSvg);\n          const svgBlob = new Blob([svgData], { type: \"image/svg+xml;charset=utf-8\" });\n          const svgUrl = URL.createObjectURL(svgBlob);\n          const downloadLink = document.createElement(\"a\");\n          downloadLink.href = svgUrl;\n          downloadLink.download = `${fileName}.svg`;\n          document.body.appendChild(downloadLink);\n          downloadLink.click();\n          document.body.removeChild(downloadLink);\n          showToast('Downloaded Barcode as SVG!', 'success');\n        } else {\n          // Convert SVG to Canvas for high-res PNG Export\n          const svgData = new XMLSerializer().serializeToString(barcodeSvg);\n          const canvas = document.createElement(\"canvas\");\n          const ctx = canvas.getContext(\"2d\");\n          const img = new Image();\n\n          const svgBlob = new Blob([svgData], { type: \"image/svg+xml;charset=utf-8\" });\n          const url = URL.createObjectURL(svgBlob);\n\n          img.onload = function () {\n            // Add padding to canvas\n            canvas.width = img.width + 20;\n            canvas.height = img.height + 20;\n            \n            // Fill background\n            ctx.fillStyle = \"#FFFFFF\";\n            ctx.fillRect(0, 0, canvas.width, canvas.height);\n            \n            ctx.drawImage(img, 10, 10);\n            \n            const pngUrl = canvas.toDataURL(\"image/png\");\n            const downloadLink = document.createElement(\"a\");\n            downloadLink.href = pngUrl;\n            downloadLink.download = `${fileName}.png`;\n            document.body.appendChild(downloadLink);\n            downloadLink.click();\n            document.body.removeChild(downloadLink);\n            URL.revokeObjectURL(url);\n            showToast('Downloaded Barcode as PNG!', 'success');\n          };\n\n          img.src = url;\n        }\n      }\n\n      // --- HELPER UTILITIES ---\n      function sanitizeFilename(str) {\n        return str.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').slice(0, 20) || 'code';\n      }\n\n      function showToast(message, type = 'info') {\n        const toast = document.createElement('div');\n        toast.className = `toast-animate pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-xl border text-xs sm:text-sm font-semibold ${\n          type === 'error' ? 'bg-rose-950/90 border-rose-500/50 text-rose-200 shadow-rose-950/50' :\n          type === 'warning' ? 'bg-amber-950/90 border-amber-500/50 text-amber-200 shadow-amber-950/50' :\n          'bg-slate-900/90 border-brand-cyan/50 text-white shadow-brand-cyan/20'\n        }`;\n\n        const iconClass = type === 'error' ? 'fa-solid fa-circle-exclamation text-rose-400' :\n                          type === 'warning' ? 'fa-solid fa-triangle-exclamation text-amber-400' :\n                          'fa-solid fa-circle-check text-brand-cyan';\n\n        toast.innerHTML = `\n          \u003ci class=\"${iconClass} text-lg\">\u003c/i>\n          \u003cspan class=\"flex-1\">${message}\u003c/span>\n        `;\n\n        toastContainer.appendChild(toast);\n\n        setTimeout(() => {\n          toast.style.opacity = '0';\n          toast.style.transform = 'translateY(-20px)';\n          toast.style.transition = 'all 0.3s ease';\n          setTimeout(() => toast.remove(), 300);\n        }, 3200);\n      }\n\n      function triggerConfetti() {\n        if (typeof confetti === 'function') {\n          confetti({\n            particleCount: 45,\n            spread: 55,\n            origin: { y: 0.7 },\n            colors: ['#FF2E93', '#7000FF', '#00F0FF', '#FFDE00']\n          });\n        }\n      }\n\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>" };
  var frames = { light: document.getElementById('view-light'), dark: document.getElementById('view-dark') };
  var btn = document.getElementById('theme-switch'), label = document.getElementById('theme-label');
  var loaded = {};

  function load(name) {
    if (!loaded[name]) { frames[name].srcdoc = SOURCES[name]; loaded[name] = true; }
  }

  function setTheme(name, save) {
    load(name);
    frames.light.hidden = name !== 'light';
    frames.dark.hidden  = name !== 'dark';
    document.body.setAttribute('data-theme', name);
    var toDark = name === 'light';
    btn.setAttribute('aria-checked', String(name === 'dark'));
    btn.setAttribute('aria-label', toDark ? 'Switch to dark theme' : 'Switch to light theme');
    label.textContent = toDark ? 'Dark theme' : 'Light theme';
    if (save) { try { localStorage.setItem('qbar-theme-v2', name); } catch (e) {} }
  }

  btn.addEventListener('click', function () {
    setTheme(document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light', true);
  });

  var start = 'dark';
  try { if (localStorage.getItem('qbar-theme-v2') === 'light') start = 'light'; } catch (e) {}
  setTheme(start, false);
})();
</script>
