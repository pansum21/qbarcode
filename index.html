<!-- QBar: ten barcode formats, example images and barcode FAQ -->
<script>
(function () {
  "use strict";

  /*
   * Runs inside each embedded theme.
   * The existing JsBarcode library generates the real example images.
   */
  function barcodeUpgradeRuntime() {
    "use strict";

    var formats = [
      {
        id: "CODE128",
        name: "CODE128",
        option: "CODE128: letters, numbers, symbols",
        example: "QBar-2026/ABC",
        description:
          "Code 128 is a compact, general-purpose linear barcode. It is commonly used for inventory, shipping labels and internal tracking.",
        rules:
          "This site's text field accepts standard printable ASCII characters: uppercase and lowercase English letters, numbers, spaces and symbols. Emoji and accented letters are not supported.",
        hint:
          "Letters, numbers and standard keyboard symbols. Example: QBar-2026/ABC.",
        explanation:
          "QBar-2026/ABC could identify an internal stock item. Code 128 includes an automatically calculated checksum."
      },
      {
        id: "CODE39",
        name: "CODE39",
        option: "CODE39: uppercase letters and numbers",
        example: "QBAR-2026",
        description:
          "Code 39 is a linear barcode used for asset labels, industrial identifiers and inventory.",
        rules:
          "Use uppercase A–Z, digits 0–9, spaces or these symbols: - . $ / + %. Lowercase letters are rejected so the encoded value is unambiguous.",
        hint:
          "Uppercase A–Z, digits and - . $ / + % or space. Example: QBAR-2026.",
        explanation:
          "QBAR-2026 could be an equipment or asset identifier. Start and stop characters are added by the encoder; do not type asterisks around your value."
      },
      {
        id: "codabar",
        name: "Codabar",
        option: "Codabar: libraries, blood banks",
        example: "A123456B",
        description:
          "Codabar is an older linear barcode used in some library, laboratory and blood-bank systems.",
        rules:
          "The data uses digits and - $ : / . +. Optional start and stop characters are A, B, C or D. Supply both boundary characters or neither; the encoder supplies A boundaries when omitted.",
        hint:
          "Digits and - $ : / . +, optionally enclosed by A–D. Example: A123456B.",
        explanation:
          "In A123456B, A is the start character, 123456 is the data and B is the stop character. This is a teaching example, not a certified blood-bank label."
      },
      {
        id: "EAN13",
        name: "EAN-13",
        option: "EAN-13: standard retail, 12 or 13 digits",
        example: "5901234123457",
        description:
          "EAN means European Article Number. EAN-13 is now used internationally for retail products and commonly carries a GTIN-13 product identifier.",
        rules:
          "Enter 12 digits to calculate the final check digit automatically, or 13 digits with a correct check digit.",
        hint:
          "12 digits plus an automatic check digit, or 13 valid digits. Example: 5901234123457.",
        explanation:
          "5901234123457 is a checksum-valid demonstration value. The first 12 digits are 590123412345 and the final check digit is 7. A GS1 prefix does not prove the product's country of manufacture."
      },
      {
        id: "EAN8",
        name: "EAN-8",
        option: "EAN-8: small retail items, 7 or 8 digits",
        example: "96385074",
        description:
          "EAN-8 is a shorter retail barcode intended for products with limited label space. It carries a GTIN-8 identifier.",
        rules:
          "Enter 7 digits to calculate the check digit automatically, or 8 digits with a correct check digit. Do not shorten an EAN-13 number to create an EAN-8 identifier.",
        hint:
          "7 digits plus an automatic check digit, or 8 valid digits. Example: 96385074.",
        explanation:
          "For the demonstration value 96385074, 9638507 is the data and 4 is the check digit."
      },
      {
        id: "UPC",
        name: "UPC-A",
        option: "UPC-A: North American retail, 11 or 12 digits",
        example: "036000291452",
        description:
          "UPC means Universal Product Code. UPC-A is widely used for retail checkout in North America and carries a GTIN-12 identifier.",
        rules:
          "Enter 11 digits to calculate the check digit automatically, or 12 digits with a correct check digit. Keep leading zeros.",
        hint:
          "11 digits plus an automatic check digit, or 12 valid digits. Example: 036000291452.",
        explanation:
          "In 036000291452, the final digit 2 is the check digit. The leading zero is part of the identifier and must not be removed."
      },
      {
        id: "UPCE",
        name: "UPC-E",
        option: "UPC-E: compact retail, 6 or 8 digits",
        example: "04252614",
        description:
          "UPC-E is a compact, zero-suppressed representation of eligible UPC-A identifiers. It is useful on small retail packages.",
        rules:
          "Enter 6 compressed data digits; this encoder assumes number system 0 and calculates the check digit. Alternatively, enter 8 digits: number system 0 or 1, six compressed digits and a valid check digit. Seven-digit input is not accepted here.",
        hint:
          "6 compressed digits, or 8 valid digits starting with 0 or 1. Examples: 425261 or 04252614.",
        explanation:
          "04252614 contains number system 0, compressed data 425261 and check digit 4. It expands to UPC-A 042100005264. Not every UPC-A identifier can be compressed into UPC-E."
      },
      {
        id: "ITF",
        name: "ITF",
        option: "ITF: Interleaved 2 of 5, even number of digits",
        example: "12345678",
        description:
          "ITF means Interleaved 2 of 5. It is a numeric linear barcode that encodes digits in pairs, using both bars and spaces.",
        rules:
          "Enter a non-empty, even number of digits. For example, 12345678 is valid, but 1234567 is not. Generic ITF does not automatically add a check digit in this generator.",
        hint:
          "Digits only; the number of digits must be even. Example: 12345678.",
        explanation:
          "12345678 is encoded as the pairs 12, 34, 56 and 78. Do not add a leading zero unless your receiving system expects it."
      },
      {
        id: "ITF14",
        name: "ITF-14",
        option: "ITF-14: cartons and master packaging, 14 digits",
        example: "10012345000017",
        description:
          "ITF-14 uses the Interleaved 2 of 5 symbology to carry a 14-digit GTIN. It is commonly used on cartons, cases and outer packaging.",
        rules:
          "This site requires exactly 14 digits, including a valid final GS1 check digit. Unlike generic ITF, ITF-14 identifies a trade item using a defined 14-digit structure.",
        hint:
          "Exactly 14 digits, including a valid check digit. Example: 10012345000017.",
        explanation:
          "10012345000017 is a checksum-valid demonstration value ending in check digit 7. Production carton labels also require appropriate dimensions, quiet zones, bearer bars and print verification."
      },
      {
        id: "PHARMACODE",
        name: "Pharmacode",
        option: "Pharmacode: pharmaceutical packaging, 3 to 131070",
        example: "1234",
        description:
          "Pharmacode, also called Pharmaceutical Binary Code, is used in pharmaceutical packaging-control systems.",
        rules:
          "Enter a whole-number value from 3 through 131070. This format represents a numeric value rather than an arbitrary product-code string.",
        hint:
          "Whole number from 3 to 131070. Example: 1234.",
        explanation:
          "1234 is represented by a sequence of narrow and wide bars. Leading zeros do not create a different numeric value. Reading direction and scanner configuration matter; this is not a retail checkout barcode."
      }
    ];

    var byId = Object.create(null);
    var samples = Object.create(null);
    var hints = Object.create(null);

    formats.forEach(function (format) {
      byId[format.id] = format;
      samples[format.id] = format.example;
      hints[format.id] = format.hint;
    });

    /*
     * Validate syntax first, then ask the existing barcode engine
     * to verify checksums and actual encodability on a detached SVG.
     * Invalid input therefore does not touch the visible preview.
     */
    function validate(text, id) {
      text = String(text);
      var format = byId[id];

      if (!format) return "Please select a supported barcode format.";
      if (!text) return "Enter barcode content first.";

      switch (id) {
        case "CODE128":
          if (!/^[\x20-\x7E]+$/.test(text)) {
            return "CODE128 accepts printable ASCII letters, numbers, spaces and symbols. Emoji and accented letters are not supported.";
          }
          break;

        case "CODE39":
          if (!/^[0-9A-Z .$/+%-]+$/.test(text)) {
            return "CODE39 accepts uppercase A–Z, digits, spaces and - . $ / + % only.";
          }
          break;

        case "codabar":
          if (!/^(?:[A-D][0-9$:/+. -]+[A-D]|[0-9$:/+. -]+)$/.test(text) ||
              /\s/.test(text)) {
            return "Codabar accepts digits and - $ : / . +. Optional A–D start and stop characters must both be supplied.";
          }
          break;

        case "EAN13":
          if (!/^\d{12,13}$/.test(text)) {
            return "EAN-13 requires 12 or 13 digits.";
          }
          break;

        case "EAN8":
          if (!/^\d{7,8}$/.test(text)) {
            return "EAN-8 requires 7 or 8 digits.";
          }
          break;

        case "UPC":
          if (!/^\d{11,12}$/.test(text)) {
            return "UPC-A requires 11 or 12 digits. Keep leading zeros.";
          }
          break;

        case "UPCE":
          if (!/^(?:\d{6}|[01]\d{7})$/.test(text)) {
            return "UPC-E requires 6 compressed data digits, or 8 digits beginning with number system 0 or 1.";
          }
          break;

        case "ITF":
          if (!/^(?:\d{2})+$/.test(text)) {
            return "ITF requires an even number of digits, with at least 2 digits.";
          }
          break;

        case "ITF14":
          if (!/^\d{14}$/.test(text)) {
            return "ITF-14 requires exactly 14 digits, including its check digit.";
          }
          break;

        case "PHARMACODE":
          if (!/^\d+$/.test(text) ||
              Number(text) < 3 ||
              Number(text) > 131070) {
            return "Pharmacode requires a whole-number value from 3 to 131070.";
          }
          break;
      }

      if (typeof window.JsBarcode !== "function") {
        return "The barcode engine has not loaded. Check your connection and reload.";
      }

      try {
        var testSvg = document.createElementNS(
          "http://www.w3.org/2000/svg", "svg"
        );

        window.JsBarcode(testSvg, text, {
          format: id,
          width: 2,
          height: 40,
          displayValue: false,
          margin: 12
        });

        return "";
      } catch (error) {
        if (/^(EAN13|EAN8|UPC|UPCE|ITF14)$/.test(id)) {
          return format.name +
            ": the check digit or identifier is invalid. Check the number against your product records.";
        }

        return "This value cannot be encoded as " + format.name + ".";
      }
    }

    window.QBarFormats = {
      formats: formats,
      byId: byId,
      samples: samples,
      hints: hints,
      validate: validate
    };

    function installInterface() {
      var select = document.getElementById("barcode-format") ||
                   document.getElementById("barcode-format-select");
      var input = document.getElementById("barcode-input");
      var generate = document.getElementById("barcode-generate") ||
                     document.getElementById("barcode-generate-btn");

      if (!select || !input || !generate) return;

      var dark = select.id === "barcode-format-select";

      var style = document.createElement("style");
      style.textContent = [
        ".qbar-guide,.qbar-format-help{",
        "--qb-ink:#243128;--qb-muted:#59675d;",
        "--qb-bg:#fff;--qb-soft:#f3f6ef;--qb-line:#dbe3d6;",
        "color:var(--qb-ink);font:14px/1.7 system-ui,sans-serif}",
        ".qbar-guide[data-dark=true],.qbar-format-help[data-dark=true]{",
        "--qb-ink:#edf2fc;--qb-muted:#bec9dc;",
        "--qb-bg:#131b2b;--qb-soft:#1b263b;--qb-line:#34435d}",
        ".qbar-guide{width:calc(100% - 32px);max-width:1080px;",
        "margin:30px auto;padding:24px;border:1px solid var(--qb-line);",
        "border-radius:18px;background:var(--qb-bg)}",
        ".qbar-guide h2{font-size:26px;line-height:1.3;margin:0 0 12px}",
        ".qbar-guide h3{font-size:18px;margin:0 0 10px}",
        ".qbar-guide p{margin:8px 0;color:var(--qb-muted)}",
        ".qbar-guide strong{color:var(--qb-ink)}",
        ".qbar-guide details{margin:12px 0;border:1px solid var(--qb-line);",
        "border-radius:12px;background:var(--qb-soft)}",
        ".qbar-guide summary{padding:15px;cursor:pointer;font-weight:700}",
        ".qbar-guide .qb-card{padding:0 16px 18px}",
        ".qbar-guide figure{margin:16px 0;padding:16px;",
        "border-radius:10px;background:#fff;color:#17211b;overflow:auto}",
        ".qbar-guide figure svg{display:block;margin:auto;",
        "max-width:100%;height:auto;background:#fff}",
        ".qbar-guide figcaption{margin-top:10px;text-align:center;",
        "font-size:12px;color:#47554a}",
        ".qbar-guide code,.qbar-format-help code{overflow-wrap:anywhere}",
        ".qbar-guide button,.qbar-format-help button{",
        "padding:9px 13px;border:1px solid var(--qb-line);",
        "border-radius:8px;background:var(--qb-soft);",
        "color:var(--qb-ink);font:inherit;cursor:pointer}",
        ".qbar-format-help{margin:12px 0;padding:13px;",
        "border:1px solid var(--qb-line);border-radius:10px;",
        "background:var(--qb-soft)}",
        ".qbar-format-help p{margin:0 0 9px}",
        ".qbar-guide .qb-notice{padding:14px;",
        "border-left:4px solid #ca932b;background:var(--qb-soft)}",
        ".qbar-guide .qb-error{color:#b34236}",
        ".info-dialog .qbar-guide{width:100%;margin:20px 0;",
        "padding:16px;box-sizing:border-box}",
        "@media(max-width:600px){.qbar-guide{padding:18px;}",
        ".qbar-guide h2{font-size:23px}}"
      ].join("");

      document.head.appendChild(style);

      function node(tag, text, className) {
        var element = document.createElement(tag);
        if (text !== undefined) element.textContent = text;
        if (className) element.className = className;
        return element;
      }

      function paragraph(parent, label, text) {
        var p = node("p");
        if (label) p.appendChild(node("strong", label + " "));
        p.appendChild(document.createTextNode(text));
        parent.appendChild(p);
      }

      function exampleButton(format) {
        var button = node("button", "Use " + format.name + " example");
        button.type = "button";
        button.setAttribute("data-qbar-example", format.id);
        return button;
      }

      var inlineHelp = node("div", undefined, "qbar-format-help");
      inlineHelp.dataset.dark = String(dark);
      inlineHelp.setAttribute("aria-live", "polite");

      var selectContainer = select.parentElement;
      selectContainer.insertAdjacentElement("afterend", inlineHelp);

      function updateInlineHelp() {
        var format = byId[select.value];
        if (!format) return;

        inlineHelp.replaceChildren();

        paragraph(inlineHelp, format.name + ":", format.rules);
        paragraph(inlineHelp, "Example:", format.example);
        inlineHelp.appendChild(exampleButton(format));

        var hint = document.getElementById("barcode-hint");
        if (hint) hint.textContent = format.hint;

        var badge = document.getElementById("barcode-type-badge");
        if (badge) badge.textContent = format.name;
      }

      /*
       * The original light-theme example chips were generic.
       * Replace them with a format-aware example control.
       */
      var oldChip = document.querySelector(
        '[data-example-tool="barcode"]'
      );

      if (oldChip && oldChip.parentElement) {
        oldChip.parentElement.hidden = true;
      }

      var guide = node("section", undefined, "qbar-guide");
      guide.dataset.dark = String(dark);
      guide.setAttribute("aria-label", "Barcode guide and frequently asked questions");

      guide.appendChild(node("h2", "Barcode guide: formats, examples and FAQ"));

      paragraph(
        guide,
        "",
        "Choose a format, enter a value that follows its rules, generate the barcode, then download PNG or SVG. Each example below is an actual barcode image generated from the displayed value."
      );

      var notice = node(
        "p",
        "Examples are for learning and testing only. Generating an image does not allocate an official GTIN or certify a label for retail, logistics, medical or pharmaceutical use. Use your assigned identifiers and verify the receiving system's requirements.",
        "qb-notice"
      );
      guide.appendChild(notice);

      var gallery = node("div");

      formats.forEach(function (format, index) {
        var details = node("details");
        if (index === 0) details.open = true;

        details.appendChild(
          node("summary", (index + 1) + ". " + format.name)
        );

        var card = node("div", undefined, "qb-card");
        paragraph(card, "What it means:", format.description);
        paragraph(card, "Accepted input:", format.rules);
        paragraph(card, "Example explained:", format.explanation);

        var figure = node("figure");
        var svg = document.createElementNS(
          "http://www.w3.org/2000/svg", "svg"
        );
        svg.setAttribute("role", "img");
        svg.setAttribute(
          "aria-label",
          format.name + " example barcode encoding " + format.example
        );

        figure.appendChild(svg);
        figure.appendChild(
          node("figcaption", format.name + " — " + format.example)
        );

        try {
          var validationError = validate(format.example, format.id);
          if (validationError) throw new Error(validationError);

          window.JsBarcode(svg, format.example, {
            format: format.id,
            lineColor: "#111111",
            background: "#ffffff",
            width: 2,
            height: 72,
            displayValue: true,
            font: "monospace",
            fontSize: 14,
            textMargin: 6,
            margin: 20
          });

          var width = parseFloat(svg.getAttribute("width"));
          var height = parseFloat(svg.getAttribute("height"));

          if (width && height) {
            svg.setAttribute("viewBox", "0 0 " + width + " " + height);
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
          }
        } catch (error) {
          svg.remove();
          figure.prepend(
            node(
              "p",
              "Example image could not load: " + error.message,
              "qb-error"
            )
          );
          console.error("QBar example verification:", format.id, error);
        }

        card.appendChild(figure);
        card.appendChild(exampleButton(format));
        details.appendChild(card);
        gallery.appendChild(details);
      });

      guide.appendChild(gallery);
      guide.appendChild(node("h3", "Barcode terminology and FAQ"));

      var glossary = [
        [
          "What is a barcode?",
          "A machine-readable representation of data. A scanner reads its pattern and returns the encoded value. For example, scanning a CODE39 barcode for QBAR-2026 returns that identifier; your inventory software decides what the identifier means."
        ],
        [
          "What is a symbology or barcode format?",
          "The rules used to turn data into bars and spaces. CODE128, EAN-13 and Codabar are different symbologies. The same text is not necessarily valid in every format."
        ],
        [
          "What do numeric, alphabetic and alphanumeric mean?",
          "Numeric means digits 0–9, such as 123456. Alphabetic means letters, such as ABC. Alphanumeric combines letters and numbers, such as BOX123. Whether symbols or lowercase letters are allowed depends on the format."
        ],
        [
          "What is a digit, and why do leading zeros matter?",
          "A digit is one character from 0 through 9. 036000291452 contains 12 digits, including its leading zero. Store barcode identifiers as text so spreadsheets or software do not remove leading zeros."
        ],
        [
          "What is a check digit or checksum?",
          "An error-detection value calculated from the encoded data. The last digit of EAN-13, EAN-8, UPC-A, UPC-E and ITF-14 is a check digit. For example, EAN-8 value 96385074 ends in check digit 4. CODE128 also has an encoded checksum. A valid checksum does not prove that an identifier was officially assigned."
        ],
        [
          "What is a GTIN?",
          "GTIN means Global Trade Item Number: an identifier for a trade item. Common lengths are GTIN-8, GTIN-12, GTIN-13 and GTIN-14. EAN-13 typically carries GTIN-13; UPC-A carries GTIN-12; ITF-14 carries GTIN-14."
        ],
        [
          "What is GS1?",
          "GS1 is the standards organization behind widely used product-identification and barcode standards. Drawing a barcode does not register a product or allocate a GS1 identifier. Use an identifier properly assigned to your product."
        ],
        [
          "What are start and stop characters?",
          "Boundary markers that tell a reader where a symbol begins and ends. In Codabar example A123456B, A is the start character and B is the stop character. Other symbologies add their boundary patterns automatically."
        ],
        [
          "What is a quiet zone?",
          "The blank space beside a barcode that separates it from nearby printing. Do not crop the margins or place graphics against the bars. Required quiet-zone dimensions depend on the symbology and application."
        ],
        [
          "What is human-readable text?",
          "The printed value beneath a barcode. It helps a person identify or enter the value manually. Hiding this text does not remove the data encoded in the bars, although some production standards require the text."
        ],
        [
          "What are module width and bar height?",
          "Module width, also called X-dimension, is the width of the narrowest basic element. Bar height is the vertical length of the bars. Avoid stretching a barcode unevenly; choose physical dimensions appropriate for your scanner and label standard."
        ],
        [
          "What are narrow and wide bars?",
          "Different bar widths used by some symbologies. Pharmacode represents a number using narrow and wide bars. ITF and CODE39 also distinguish element widths, but use different encoding rules."
        ],
        [
          "What does interleaved mean in ITF?",
          "Digits are encoded in pairs: one digit determines a pattern of bars and the other determines the spaces between them. That is why generic ITF requires an even number of digits."
        ],
        [
          "What are UPC-E zero suppression and number systems?",
          "Zero suppression represents certain zero-rich UPC-A identifiers more compactly. UPC-E's number-system digit is 0 or 1 in this encoder. Example 04252614 expands to UPC-A 042100005264; arbitrary UPC-A identifiers cannot all be shortened."
        ],
        [
          "What are ITF-14 bearer bars?",
          "Additional bars around or above and below the symbol that support printing and reduce certain partial-scan risks. The example here demonstrates the encoded data; production ITF-14 labels need the appropriate bearer bars, dimensions and verification."
        ],
        [
          "What is the difference between PNG and SVG?",
          "PNG is a raster image made of pixels; enlarging it can blur edges. SVG describes shapes and scales without raster blur. SVG is often useful for printing, but physical barcode dimensions still need to be set correctly."
        ],
        [
          "How do I make a barcode easy to scan?",
          "Use dark bars on a light background, retain quiet zones, keep edges sharp and avoid distortion. Test with the actual receiving scanner. Retail scanners may not enable CODE128, Codabar or Pharmacode by default. Regulated or high-volume labels may require formal print-quality verification."
        ],
        [
          "Do these barcodes expire or store a product's price?",
          "A downloaded static barcode does not expire on its own. It normally encodes an identifier, not a live product record or price. The receiving database determines what that identifier means and whether it remains active."
        ]
      ];

      glossary.forEach(function (item) {
        var details = node("details");
        details.appendChild(node("summary", item[0]));
        var body = node("div", undefined, "qb-card");
        paragraph(body, "", item[1]);
        details.appendChild(body);
        guide.appendChild(details);
      });

      document.body.appendChild(guide);

      /*
       * The light theme populates its help dialog from this template.
       * Include the same illustrated guide without replacing existing help.
       * Both themes also have the full guide directly on the page.
       */
      var helpTemplate = document.getElementById("help-template");
      if (helpTemplate && helpTemplate.content) {
        helpTemplate.content.appendChild(guide.cloneNode(true));
      }

      document.addEventListener("click", function (event) {
        var target = event.target instanceof Element
          ? event.target.closest("[data-qbar-example]")
          : null;

        if (!target) return;

        var format = byId[target.getAttribute("data-qbar-example")];
        if (!format) return;

        event.preventDefault();

        var dialog = target.closest("dialog");
        if (dialog && dialog.open) dialog.close();

        var barcodeTab = document.getElementById(
          dark ? "tab-btn-barcode" : "tab-barcode"
        );
        if (barcodeTab) barcodeTab.click();

        input.value = format.example;
        select.value = format.id;

        input.dispatchEvent(new Event("input", { bubbles: true }));
        select.dispatchEvent(new Event("change", { bubbles: true }));
        generate.click();

        input.scrollIntoView({ block: "center" });
      });

      select.addEventListener("change", function () {
        /*
         * Run after the original theme's change listeners.
         */
        Promise.resolve().then(updateInlineHelp);
      });

      updateInlineHelp();
    }

    if (document.readyState === "loading") {
      document.addEventListener(
        "DOMContentLoaded", installInterface, { once: true }
      );
    } else {
      installInterface();
    }
  }

  function replaceExactlyOnce(source, pattern, replacement, label) {
    var matches = source.match(
      new RegExp(pattern.source, "g")
    );

    if (!matches || matches.length !== 1) {
      throw new Error(
        label + ": expected exactly one matching source block."
      );
    }

    return source.replace(pattern, function () {
      return replacement;
    });
  }

  function upgradeThemeSource(source) {
    if (!source ||
        source.indexOf('data-qbar-upgraded="1"') !== -1) {
      return source;
    }

    var isDark = /id=["']barcode-format-select["']/.test(source);
    var isLight = /id=["']barcode-format["']/.test(source);

    if (!isDark && !isLight) {
      throw new Error("Could not locate the barcode format selector.");
    }

    var optionData = [
      ["CODE128", "CODE128: letters, numbers, symbols"],
      ["CODE39", "CODE39: uppercase letters and numbers"],
      ["codabar", "Codabar: libraries, blood banks"],
      ["EAN13", "EAN-13: standard retail, 12 or 13 digits"],
      ["EAN8", "EAN-8: small retail items, 7 or 8 digits"],
      ["UPC", "UPC-A: North American retail, 11 or 12 digits"],
      ["UPCE", "UPC-E: compact retail, 6 or 8 digits"],
      ["ITF", "ITF: Interleaved 2 of 5, even number of digits"],
      ["ITF14", "ITF-14: cartons and master packaging, 14 digits"],
      ["PHARMACODE", "Pharmacode: pharmaceutical packaging, 3 to 131070"]
    ];

    var options = optionData.map(function (item, index) {
      return '<option value="' + item[0] + '"' +
        (index === 0 ? " selected" : "") +
        (isDark ? ' class="bg-slate-900 text-white"' : "") +
        ">" + item[1] + "</option>";
    }).join("");

    var selectPattern =
      /<select\b[^>]*\bid=["']barcode-format(?:-select)?["'][^>]*>[\s\S]*?<\/select>/;

    var selectMatch = source.match(selectPattern);
    if (!selectMatch) {
      throw new Error("Could not read the barcode selector.");
    }

    var openingTag = selectMatch[0].slice(
      0, selectMatch[0].indexOf(">") + 1
    );

    source = replaceExactlyOnce(
      source,
      selectPattern,
      openingTag + options + "</select>",
      "Barcode options"
    );

    if (isLight) {
      source = replaceExactlyOnce(
        source,
        /var BC_SAMPLES\s*=\s*\{[\s\S]*?\};/,
        "var BC_SAMPLES = window.QBarFormats.samples;",
        "Light-theme examples"
      );

      source = replaceExactlyOnce(
        source,
        /var BC_HINTS\s*=\s*\{[\s\S]*?\};/,
        "var BC_HINTS = window.QBarFormats.hints;",
        "Light-theme format hints"
      );

      source = replaceExactlyOnce(
        source,
        /function validateBarcode\s*\(text,\s*fmt\)\s*\{[\s\S]*?return '';\s*\}/,
        [
          "function validateBarcode(text, fmt) {",
          "  return window.QBarFormats.validate(text, fmt);",
          "}"
        ].join("\n"),
        "Light-theme validation"
      );

      /*
       * Give newly added formats friendly names in the preview.
       */
      source = source.replace(
        /\$\('barcode-format-label'\)\.textContent\s*=\s*[^;]+;/,
        "$('barcode-format-label').textContent = " +
        "window.QBarFormats.byId[fmt].name;"
      );
    }

    if (isDark) {
      source = replaceExactlyOnce(
        source,
        /function validateBarcodeFormat\s*\(\)\s*\{[\s\S]*?return isValid;\s*\}/,
        [
          "function validateBarcodeFormat() {",
          "  const text = barcodeInput.value.trim();",
          "  const format = barcodeFormatSelect.value;",
          "  if (!text) {",
          "    barcodeWarningBanner.classList.add('hidden');",
          "    barcodeInput.removeAttribute('aria-invalid');",
          "    return true;",
          "  }",
          "  const message = window.QBarFormats.validate(text, format);",
          "  barcodeWarningMsg.textContent = message;",
          "  barcodeWarningBanner.classList.toggle('hidden', !message);",
          "  if (message) {",
          "    barcodeInput.setAttribute('aria-invalid', 'true');",
          "  } else {",
          "    barcodeInput.removeAttribute('aria-invalid');",
          "  }",
          "  return !message;",
          "}"
        ].join("\n"),
        "Dark-theme validation"
      );

      source = source.replace(
        /barcodeTypeBadge\.textContent\s*=\s*fmt;/g,
        "barcodeTypeBadge.textContent = window.QBarFormats.byId[fmt].name;"
      );
    }

    /*
     * Define the shared format rules before the original theme app runs.
     * Build the closing script tag in pieces to keep this outer script safe.
     */
    var runtime = "(" + barcodeUpgradeRuntime.toString() + ")();";
    runtime = runtime.replace(
      new RegExp("<" + "/script", "gi"),
      "<\\/script"
    );

    var bootstrap =
      '<meta data-qbar-upgraded="1">' +
      "<script>" + runtime + "<" + "/script>";

    if (!/<head\b[^>]*>/i.test(source)) {
      throw new Error("The embedded theme has no head element.");
    }

    source = source.replace(
      /<head\b[^>]*>/i,
      function (head) { return head + bootstrap; }
    );

    return source;
  }

  var reportedErrors = Object.create(null);

  function reportError(frame, error) {
    console.error("QBar barcode upgrade failed:", frame.id, error);

    if (reportedErrors[frame.id]) return;
    reportedErrors[frame.id] = true;

    var alert = document.createElement("div");
    alert.setAttribute("role", "alert");
    alert.textContent =
      "Barcode update could not be applied to " + frame.id +
      ": " + error.message;

    alert.style.cssText =
      "position:fixed;top:12px;left:12px;right:12px;" +
      "z-index:2147483647;padding:16px;border-radius:10px;" +
      "background:#fff1ef;color:#8f231b;border:2px solid #bf453b;" +
      "font:14px/1.5 system-ui,sans-serif;";

    document.body.appendChild(alert);
  }

  /*
   * The original wrapper lazily loads each theme into srcdoc.
   * Watch both frames so the update also applies when a user
   * opens the other theme for the first time.
   */
  ["view-light", "view-dark"].forEach(function (id) {
    var frame = document.getElementById(id);
    if (!frame) return;

    function applyUpgrade() {
      var source = frame.getAttribute("srcdoc");
      if (!source ||
          source.indexOf('data-qbar-upgraded="1"') !== -1) {
        return;
      }

      try {
        var updated = upgradeThemeSource(source);
        if (updated !== source) frame.srcdoc = updated;
      } catch (error) {
        reportError(frame, error);
      }
    }

    var observer = new MutationObserver(applyUpgrade);
    observer.observe(frame, {
      attributes: true,
      attributeFilter: ["srcdoc"]
    });

    applyUpgrade();
  });
})();
</script>
