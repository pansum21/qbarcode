  .view[hidden] { display: none; }

  /* Theme switch in the top-right corner */
  .theme-switch {
    --sw-bg: #285a43; --sw-fg: #ffffff; --sw-knob: #d4edac;
    position: fixed; z-index: 2147483000;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 6px; border: 0; border-radius: 999px;
    background: var(--sw-bg); color: var(--sw-fg);
    font: 600 13px/1 "Inter", "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-shadow: 0 6px 20px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.18) inset;
    cursor: pointer; transition: transform .15s ease;
  }
  .theme-switch:hover { transform: translateY(-1px); }
  .theme-switch:active { transform: translateY(0) scale(.98); }
  .theme-switch:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  body[data-theme="dark"] .theme-switch { --sw-bg: #1c1233; --sw-fg: #ffffff; --sw-knob: #FF2E93; }

  .track { position: relative; width: 44px; height: 26px; border-radius: 999px; background: rgba(255,255,255,.18); flex: none; }
  .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--sw-knob); transition: transform .22s ease; }
  body[data-theme="dark"] .knob { transform: translateX(18px); }
  @media (prefers-reduced-motion: reduce) { .knob, .theme-switch { transition: none; } }
  @media (max-width: 480px) { .theme-switch .label { display: none; } .theme-switch { padding-right: 6px; } }
</style>

    .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(255, 46, 147, 0.5); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="text-slate-100 flex flex-col justify-between min-h-screen p-4 sm:p-8">
  <main class="w-full max-w-4xl mx-auto my-auto z-10">
    <header class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass-card text-brand-cyan text-xs font-semibold uppercase mb-3 border border-brand-cyan/30">
        <i class="fa-solid fa-wand-magic-sparkles text-brand-yellow"></i> All-in-One Generator
      </div>
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight mb-2">
        <span class="bg-gradient-to-r from-brand-pink via-brand-violet to-brand-cyan bg-clip-text text-transparent">
          QBar Code Studio
        </span>
      </h1>
      <p class="text-slate-400 text-sm max-w-lg mx-auto">
        Instant, high-resolution QR codes &amp; barcodes. 100% Free &amp; Unlimited.
      </p>
    </header>

    <div class="glass-card rounded-3xl p-6 sm:p-10 shadow-2xl">
      <div class="flex items-center justify-center p-1.5 bg-slate-950/80 rounded-2xl border border-slate-800 mb-8 max-w-md mx-auto">
        <button id="tab-btn-qr" onclick="switchTab('qr')" class="flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-brand-pink to-brand-violet text-white">
          <i class="fa-solid fa-qrcode"></i> QR Code
        </button>
        <button id="tab-btn-barcode" onclick="switchTab('barcode')" class="flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 text-slate-400 hover:text-white">
          <i class="fa-solid fa-barcode"></i> Barcode
        </button>
      </div>

      <!-- QR Tab -->
      <div id="tab-qr" class="tab-content active">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
          <div class="lg:col-span-7 space-y-4">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-300">Content or URL</label>
            <input type="text" id="qr-input" value="https://github.com" class="glass-input w-full px-4 py-3 rounded-2xl text-slate-100 text-sm" />
            <button onclick="genQr()" class="btn-gradient w-full py-4 rounded-2xl font-bold text-white text-sm">Generate QR Code</button>
          </div>
          <div class="lg:col-span-5 flex flex-col items-center justify-center p-6 bg-slate-900/90 rounded-3xl border border-slate-800">
            <div id="qr-target" class="p-4 bg-white rounded-2xl"></div>
            <button onclick="dlQr()" class="mt-4 w-full py-3 px-4 rounded-xl font-bold text-slate-900 bg-brand-cyan text-sm">Download PNG</button>
          </div>
        </div>
      </div>

      <!-- Barcode Tab -->
      <div id="tab-barcode" class="tab-content">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
          <div class="lg:col-span-7 space-y-4">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-300">Barcode Content</label>
            <input type="text" id="bc-input" value="QBAR-128" class="glass-input w-full px-4 py-3 rounded-2xl text-slate-100 text-sm" />
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mt-2">Format</label>
            <select id="bc-fmt" onchange="genBc()" class="glass-input w-full px-4 py-3 rounded-2xl text-slate-100 text-sm">
              <option value="CODE128">CODE128</option>
              <option value="CODE39">CODE39</option>
              <option value="codabar">Codabar</option>
              <option value="EAN13">EAN-13</option>
              <option value="EAN8">EAN-8</option>
              <option value="UPC">UPC-A</option>
              <option value="UPCE">UPC-E</option>
              <option value="ITF">ITF</option>
              <option value="ITF14">ITF-14</option>
              <option value="pharmacode">Pharmacode</option>
            </select>
            <button onclick="genBc()" class="btn-gradient w-full py-4 rounded-2xl font-bold text-white text-sm">Generate Barcode</button>
          </div>
          <div class="lg:col-span-5 flex flex-col items-center justify-center p-6 bg-slate-900/90 rounded-3xl border border-slate-800">
            <div class="p-4 bg-white rounded-2xl w-full flex justify-center"><svg id="bc-svg"></svg></div>
            <button onclick="dlBc()" class="mt-4 w-full py-3 px-4 rounded-xl font-bold text-slate-900 bg-brand-cyan text-sm">Download SVG</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="mt-8 text-center text-xs text-slate-500">
      © 2026 QBar Code Studio · Fast, Client-Side, &amp; Unlimited
    </footer>
  </main>

  <script>
    let qr = null;
    function switchTab(t) {
      document.getElementById('tab-qr').className = t === 'qr' ? 'tab-content active' : 'tab-content';
      document.getElementById('tab-barcode').className = t === 'barcode' ? 'tab-content active' : 'tab-content';
      document.getElementById('tab-btn-qr').className = t === 'qr' ? 'flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-brand-pink to-brand-violet text-white' : 'flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 text-slate-400 hover:text-white';
      document.getElementById('tab-btn-barcode').className = t === 'barcode' ? 'flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-brand-pink to-brand-violet text-white' : 'flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 text-slate-400 hover:text-white';
      if (t === 'barcode') genBc();
    }
    function genQr() {
      const val = document.getElementById('qr-input').value.trim() || 'https://github.com';
      const container = document.getElementById('qr-target');
      container.innerHTML = '';
      qr = new QRCodeStyling({
        width: 200, height: 200, type: 'svg', data: val,
        dotsOptions: { color: '#0f172a', type: 'rounded' },
        backgroundOptions: { color: '#ffffff' }
      });
      qr.append(container);
    }
    function dlQr() { if (qr) qr.download({ name: 'qbar-qr', extension: 'png' }); }
    function genBc() {
      const val = document.getElementById('bc-input').value.trim() || 'QBAR-128';
      const fmt = document.getElementById('bc-fmt').value;
      try {
        JsBarcode('#bc-svg', val, { format: fmt, lineColor: '#0f172a', width: 2, height: 60, displayValue: true });
      } catch (e) { alert('Invalid input for selected format.'); }
    }
    function dlBc() {
      const svg = document.getElementById('bc-svg');
      const xml = new XMLSerializer().serializeToString(svg);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }));
      a.download = 'qbar-barcode.svg'; a.click();
    }
    window.addEventListener('DOMContentLoaded', () => { genQr(); });
  <\/script>
</body>
</html>`
  };

  var frames = { light: document.getElementById('view-light'), dark: document.getElementById('view-dark') };
  var btn = document.getElementById('theme-switch'), label = document.getElementById('theme-label');
  var loaded = {};

  function load(name) {
    if (!loaded[name]) { frames[name].srcdoc = SOURCES[name]; loaded[name] = true; }
  }

  function setTheme(name, save) {
    load(name);
    frames.light.hidden = name !== 'light';
    frames.dark.hidden  = name !== 'dark';
    document.body.setAttribute('data-theme', name);
    var toDark = name === 'light';
    btn.setAttribute('aria-checked', String(name === 'dark'));
    btn.setAttribute('aria-label', toDark ? 'Switch to dark theme' : 'Switch to light theme');
    label.textContent = toDark ? 'Dark theme' : 'Light theme';
    if (save) { try { localStorage.setItem('qbar-theme-v2', name); } catch (e) {} }
  }

  btn.addEventListener('click', function () {
    setTheme(document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light', true);
  });

  var start = 'dark';
  try { if (localStorage.getItem('qbar-theme-v2') === 'light') start = 'light'; } catch (e) {}
  setTheme(start, false);
})();
</script>
</body>
</html>
