<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .view { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .view[hidden] { display: none; }

  /* Switch pinned to TOP-RIGHT corner */
  .theme-switch {
    --sw-bg: #285a43; --sw-fg: #ffffff; --sw-knob: #d4edac;
    position: fixed; z-index: 2147483000;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 6px; border: 0; border-radius: 999px;
    background: var(--sw-bg); color: var(--sw-fg);
    font: 600 13px/1 "Inter", "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-shadow: 0 6px 20px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.18) inset;
    cursor: pointer; transition: transform .15s ease;
  }
  .theme-switch:hover { transform: translateY(-1px); }
  .theme-switch:active { transform: translateY(0) scale(.98); }
  .theme-switch:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  body[data-theme="dark"] .theme-switch { --sw-bg: #1c1233; --sw-fg: #ffffff; --sw-knob: #FF2E93; }

  .track { position: relative; width: 44px; height: 26px; border-radius: 999px; background: rgba(255,255,255,.18); flex: none; }
  .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--sw-knob); transition: transform .22s ease; }
  body[data-theme="dark"] .knob { transform: translateX(18px); }
  @media (prefers-reduced-motion: reduce) { .knob, .theme-switch { transition: none; } }
  @media (max-width: 480px) { .theme-switch .label { display: none; } .theme-switch { padding-right: 6px; } }
</style>
</head>
<body data-theme="dark">

  <span class="track" aria-hidden="true"><span class="knob"></span></span>
  <span class="label" id="theme-label">Light theme</span>
</button>

    <!-- Features / Benefits -->
    <section class="benefits">

  <!-- Help / How it works dialog (Includes barcode format guide) -->

    <ol class="help-steps">
      <li><span class="step-number">1</span><div><strong>Select code &amp; enter data</strong><p style="font-size:11px;color:var(--muted)">Choose QR Code or Barcode and fill in your text, URL or numbers.</p></div></li>
      <li><span class="step-number">2</span><div><strong>Preview instantly</strong><p style="font-size:11px;color:var(--muted)">Your code generates directly in real time on your machine.</p></div></li>
      <li><span class="step-number">3</span><div><strong>Download &amp; use</strong><p style="font-size:11px;color:var(--muted)">Save high-resolution PNG or SVG vectors ready for production.</p></div></li>
    </ol>
    <h3 style="font-family:var(--heading);font-size:15px;margin:18px 0 6px;">Barcode Formats &amp; Rules</h3>

    <div class="guide-card-mini"><strong>CODE39</strong><p style="font-size:10px;color:var(--muted)">Uppercase A-Z and digits. Sample: <code>QBAR-39</code></p><svg class="dialog-bc" data-fmt="CODE39" data-val="QBAR-39"></svg></div>

  </dialog>

  <script>
    let qrInst = null;
    const SAMPLE_VALS = {
      CODE128: 'QBAR-128', CODE39: 'QBAR-39', codabar: 'A12345B',
      EAN13: '5901234123457', EAN8: '96385074', UPC: '036000291452',
      UPCE: '04252614', ITF: '12345678', ITF14: '15400141288763', pharmacode: '1234'
    };
    function autoFormatExample() {
      const fmt = document.getElementById('bc-format').value;
      if (SAMPLE_VALS[fmt]) document.getElementById('bc-input').value = SAMPLE_VALS[fmt];
      makeBc();
    }
    function setTab(tab) {
      document.getElementById('panel-qr').style.display = tab === 'qr' ? 'grid' : 'none';
      document.getElementById('panel-barcode').style.display = tab === 'barcode' ? 'grid' : 'none';
      document.getElementById('tab-qr').setAttribute('aria-selected', tab === 'qr');
      document.getElementById('tab-barcode').setAttribute('aria-selected', tab === 'barcode');
      if (tab === 'barcode') makeBc();
    }
    function setQrVal(v) { document.getElementById('qr-input').value = v; makeQr(); }
    function makeQr() {
      const val = document.getElementById('qr-input').value.trim() || 'https://example.com';
      const container = document.getElementById('qr-code');
      container.innerHTML = '';
      qrInst = new QRCodeStyling({
        width: 200, height: 200, type: 'svg', data: val,
        dotsOptions: { color: '#285a43', type: 'rounded' },
        backgroundOptions: { color: '#ffffff' }
      });
      qrInst.append(container);
    }
    function dlQr() { if (qrInst) qrInst.download({ name: 'qbar-qr', extension: 'png' }); }
